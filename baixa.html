<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WMS - Baixa de Estoque</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f7;font:15px Arial;color:#111}header{background:#111;color:white;padding:18px;font-weight:bold}.wrap{max-width:620px;margin:auto;padding:18px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:20px}label{display:block;font-size:12px;font-weight:bold;margin:14px 0 7px}input{width:100%;padding:15px;border:1px solid #ccc;border-radius:10px;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:10px;background:#f5c400;font-weight:bold;margin-top:14px}.info{background:#f4f4f4;padding:12px;border-radius:9px;margin:12px 0;line-height:1.5}.toast{position:fixed;bottom:18px;left:14px;right:14px;background:#111;color:#fff;padding:13px;border-radius:10px}</style></head><body><header>WMS • Baixa de Estoque</header><main class="wrap"><div class="card"><h2>Baixa automática</h2><p>Leia o produto. O sistema identifica automaticamente se o saldo possui UZ.</p><div id="stage"></div><button onclick="location.href='mobile.html'">Voltar</button></div></main><script>const db=supabase.createClient('https://wqhxzzvlxkhcogxqurlk.supabase.co','sb_publishable_8XtQPhzITuD5AuGHJ0DfQQ_iM5PAZ0w'),stage=document.getElementById('stage');let P=[],E=[],U=[],ST=[],f={};function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}function product(v){v=v.toLowerCase();return P.find(x=>String(x.sku).toLowerCase()===v||String(x.ean||'').toLowerCase()===v)}function enter(fn){let v=document.getElementById('v');if(v){v.focus();v.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();fn()}}}}function handling(p,q){if(!(q>0))return'Quantidade inválida';if(p.tipo_manuseio!=='POR_QUANTIDADE'&&q!==1)return'Este item permite 1 unidade por operação';if(q>Number(p.quantidade_manuseio||1))return'Limite máximo: '+Number(p.quantidade_manuseio||1);return''}function start(){f={};stage.innerHTML='<label>SKU / EAN</label><input id="v" autofocus placeholder="Bipe o produto"><button onclick="check()">Continuar</button>';enter(check)}function check(){let p=product(document.getElementById('v').value.trim());if(!p||p.ativo===false)return toast('Item não encontrado ou inativo');f.p=p;f.com=ST.filter(x=>x.produto_id===p.id&&x.uz_id&&Number(x.quantidade)>0);f.sem=ST.filter(x=>x.produto_id===p.id&&!x.uz_id&&Number(x.quantidade)>0);if(f.com.length){stage.innerHTML='<div class="info"><b>Saldo com UZ.</b><br>Direcionado para Baixa por UZ.</div><label>UZ</label><input id="v" autofocus placeholder="Bipe a UZ"><button onclick="uzFlow()">Continuar</button>';return enter(uzFlow)}if(f.sem.length){stage.innerHTML='<div class="info"><b>Saldo sem UZ.</b><br>Direcionado para Baixa sem UZ.</div><label>Endereço</label><input id="v" autofocus placeholder="Bipe o endereço"><button onclick="addressFlow()">Continuar</button>';return enter(addressFlow)}toast('Produto sem saldo disponível')}function uzFlow(){let c=document.getElementById('v').value.trim().toLowerCase(),u=U.find(x=>String(x.codigo).toLowerCase()===c&&x.status==='ATIVA');if(!u)return toast('UZ inválida');let r=f.com.find(x=>x.uz_id===u.id);if(!r)return toast('Produto sem saldo nessa UZ');f.u=u;f.saldo=Number(r.quantidade);qty()}function addressFlow(){let c=document.getElementById('v').value.trim().toLowerCase(),a=E.find(x=>String(x.codigo||x.posicao).toLowerCase()===c);if(!a)return toast('Endereço inválido');let s=f.sem.filter(x=>x.endereco_id===a.id).reduce((n,x)=>n+Number(x.quantidade),0);if(!s)return toast('Sem saldo neste endereço');f.a=a;f.saldo=s;qty()}function qty(){stage.innerHTML='<div class="info">Modo: <b>'+(f.u?'COM UZ':'SEM UZ')+'</b><br>Saldo: '+f.saldo+'</div><label>Quantidade</label><input id="v" type="number" min="1" autofocus value="'+(f.p.tipo_manuseio==='POR_QUANTIDADE'?'':'1')+'"><label>Motivo</label><input id="mot" placeholder="Motivo da operação"><button onclick="finish()">Confirmar</button>';enter(finish)}async function finish(){let q=Number(document.getElementById('v').value),er=handling(f.p,q);if(er)return toast(er);if(q>f.saldo)return toast('Quantidade maior que o saldo');let mot=document.getElementById('mot').value.trim()||'BAIXA DE ESTOQUE',r;if(f.u)r=await db.rpc('wms_uz_baixar',{p_uz:f.u.codigo,p_produto:f.p.id,p_quantidade:q});else r=await db.rpc('wms_baixar_estoque_auto',{p_produto:f.p.id,p_quantidade:q,p_endereco:f.a.id,p_motivo:mot});if(r.error)return toast(r.error.message);toast('Baixa concluída');await load();setTimeout(start,400)}async function load(){let rs=await Promise.all([db.from('produtos').select('*'),db.from('enderecos').select('*'),db.from('uz_paletes').select('*'),db.from('estoque').select('*')]),bad=rs.find(x=>x.error);if(bad)throw bad.error;[P,E,U,ST]=rs.map(x=>x.data||[])}(async()=>{let{data:{session}}=await db.auth.getSession();if(!session)return location.replace('login.html');try{await load();start()}catch(e){toast(e.message)}})();</script></body></html>
