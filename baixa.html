<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WMS - Baixa de Estoque</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f7;font:15px Arial;color:#111}header{background:#111;color:#fff;padding:18px;font-weight:bold}.wrap{max-width:620px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:20px}label{display:block;font-size:12px;font-weight:bold;margin:14px 0 7px}input{width:100%;padding:15px;border:1px solid #ccc;border-radius:10px;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:10px;background:#f5c400;font-weight:bold;margin-top:14px}.info{background:#f4f4f4;padding:12px;border-radius:9px;margin:12px 0;line-height:1.5}.uz{background:#fff8d5;border:1px solid #eadb8c}.toast{position:fixed;bottom:18px;left:14px;right:14px;background:#111;color:#fff;padding:13px;border-radius:10px}</style></head><body><header>WMS • Baixa de Estoque</header><main class="wrap"><div class="card"><h2>Baixa de estoque</h2><p>Primeiro bipe o endereço. O WMS verifica automaticamente se existe UZ ativa na posição.</p><div id="stage"></div><button onclick="location.href='mobile.html'">Voltar</button></div></main><script>const db=supabase.createClient('https://wqhxzzvlxkhcogxqurlk.supabase.co','sb_publishable_8XtQPhzITuD5AuGHJ0DfQQ_iM5PAZ0w'),stage=document.getElementById('stage');let P=[],E=[],U=[],ST=[],UI=[],f={};function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}function enter(fn){let v=document.getElementById('v');if(v){v.focus();v.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();fn()}}}}function findP(v){v=v.toLowerCase();return P.find(x=>String(x.sku).toLowerCase()===v||String(x.ean||'').toLowerCase()===v)}function findE(v){v=v.toLowerCase();return E.find(x=>String(x.codigo||x.posicao).toLowerCase()===v)}function validQty(p,q){if(!(q>0))return'Quantidade inválida';if(p.tipo_manuseio!=='POR_QUANTIDADE'&&q!==1)return'Este item permite 1 unidade por operação';if(q>Number(p.quantidade_manuseio||1))return'Limite máximo: '+Number(p.quantidade_manuseio||1);return''}function start(){f={};stage.innerHTML='<label>1. Bipe o endereço</label><input id="v" autofocus placeholder="Endereço físico"><button onclick="checkAddress()">Continuar</button>';enter(checkAddress)}function checkAddress(){let a=findE(document.getElementById('v').value.trim());if(!a||a.ativo===false)return toast('Endereço inválido ou inativo');f.a=a;let us=U.filter(x=>x.endereco_id===a.id&&x.status==='ATIVA');if(us.length){f.uzExpected=us;stage.innerHTML='<div class="info uz"><b>Este endereço possui UZ.</b><br>Para realizar a baixa, bipe a UZ física da posição.</div><label>2. Bipe a UZ</label><input id="v" autofocus placeholder="Etiqueta UZ"><button onclick="checkUZ()">Continuar</button>';return enter(checkUZ)}stage.innerHTML='<div class="info"><b>Endereço sem UZ ativa.</b><br>A baixa será realizada diretamente no saldo sem UZ desta posição.</div><label>2. Bipe o produto</label><input id="v" autofocus placeholder="SKU / EAN"><button onclick="checkProductNoUZ()">Continuar</button>';enter(checkProductNoUZ)}function checkUZ(){let c=document.getElementById('v').value.trim().toLowerCase(),u=f.uzExpected.find(x=>String(x.codigo).toLowerCase()===c);if(!u)return toast('A UZ bipada não pertence a este endereço');f.u=u;stage.innerHTML='<div class="info uz"><b>UZ '+u.codigo+' confirmada.</b></div><label>3. Bipe o produto</label><input id="v" autofocus placeholder="SKU / EAN"><button onclick="checkProductUZ()">Continuar</button>';enter(checkProductUZ)}function checkProductUZ(){let p=findP(document.getElementById('v').value.trim());if(!p||p.ativo===false)return toast('Item não encontrado ou inativo');let linhas=ST.filter(x=>x.produto_id===p.id&&x.uz_id===f.u.id&&x.endereco_id===f.a.id&&Number(x.quantidade)>0),saldo=linhas.reduce((n,x)=>n+Number(x.quantidade),0);if(!saldo)return toast('Este produto não possui saldo nesta UZ');f.p=p;f.saldo=saldo;qty()}function checkProductNoUZ(){let p=findP(document.getElementById('v').value.trim());if(!p||p.ativo===false)return toast('Item não encontrado ou inativo');let linhas=ST.filter(x=>x.produto_id===p.id&&!x.uz_id&&x.endereco_id===f.a.id&&Number(x.quantidade)>0),saldo=linhas.reduce((n,x)=>n+Number(x.quantidade),0);if(!saldo)return toast('Produto sem saldo sem UZ neste endereço');f.p=p;f.saldo=saldo;qty()}function qty(){stage.innerHTML='<div class="info"><b>Endereço:</b> '+(f.a.codigo||f.a.posicao)+'<br><b>Modo:</b> '+(f.u?'BAIXA POR UZ • '+f.u.codigo:'BAIXA SEM UZ')+'<br><b>Produto:</b> '+f.p.sku+' • '+f.p.nome+'<br><b>Saldo disponível:</b> '+f.saldo+'</div><label>Quantidade</label><input id="v" type="number" min="1" autofocus value="'+(f.p.tipo_manuseio==='POR_QUANTIDADE'?'':'1')+'"><label>Motivo</label><input id="mot" placeholder="Motivo da operação"><button onclick="finish()">Confirmar baixa</button>';enter(finish)}async function finish(){let q=Number(document.getElementById('v').value),er=validQty(f.p,q);if(er)return toast(er);if(q>f.saldo)return toast('Quantidade maior que o saldo disponível');let mot=document.getElementById('mot').value.trim()||'BAIXA DE ESTOQUE',r;if(f.u)r=await db.rpc('wms_uz_baixar',{p_uz:f.u.codigo,p_produto:f.p.id,p_quantidade:q});else r=await db.rpc('wms_baixar_estoque_auto',{p_produto:f.p.id,p_quantidade:q,p_endereco:f.a.id,p_motivo:mot});if(r.error)return toast(r.error.message);toast('Baixa concluída');await load();setTimeout(start,450)}async function load(){let rs=await Promise.all([db.from('produtos').select('*'),db.from('enderecos').select('*'),db.from('uz_paletes').select('*'),db.from('estoque').select('*'),db.from('uz_itens').select('*')]),bad=rs.find(x=>x.error);if(bad)throw bad.error;[P,E,U,ST,UI]=rs.map(x=>x.data||[])}(async()=>{let{data:{session}}=await db.auth.getSession();if(!session)return location.replace('login.html');try{await load();start()}catch(e){toast(e.message)}})();</script></body></html>
