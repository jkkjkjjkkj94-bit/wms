<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WMS • Administração</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#15171a;font:13px Inter,Segoe UI,Arial,sans-serif}.top{height:58px;background:#111315;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{font-weight:800}.brand b{display:inline-grid;place-items:center;width:30px;height:30px;background:#ffc800;color:#111;border-radius:8px;margin-right:9px}.logout,.btn{border:1px solid #e4b700;background:#ffc800;color:#111;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.logout{border-color:#333;background:#1b1d20;color:#ddd}.wrap{max-width:1200px;margin:auto;padding:30px 20px}.status{font-size:11px;color:#777;margin:7px 0 22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card,.panel{background:#fff;border:1px solid #e5e8ec;border-radius:14px;padding:18px}.card:before{content:'';display:block;width:26px;height:4px;background:#ffc800;border-radius:5px;margin-bottom:14px}.num{font-size:26px;font-weight:850}.label{font-size:10px;color:#777;text-transform:uppercase;font-weight:800}.panel{margin-top:18px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;border-bottom:1px solid #eee;padding:11px;font-size:11px}th{font-size:9px;color:#777;text-transform:uppercase}.actions{display:flex;gap:10px;margin:20px 0}.actions .btn{min-width:150px}.err{color:#c43b35}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:20px 13px}}</style></head><body><header class="top"><div class="brand"><b>W</b>WMS • Administração</div><button class="logout" onclick="logout()">Sair</button></header><main class="wrap"><h1>Dashboard</h1><div id="status" class="status">Validando acesso...</div><div class="actions"><button class="btn" onclick="location.href='mobile.html'">Central de Bipagem</button><button class="btn" onclick="location.href='operador.html'">Operação</button></div><section class="grid"><div class="card"><div class="label">Itens</div><div id="ki" class="num">0</div></div><div class="card"><div class="label">Estoque</div><div id="ke" class="num">0</div></div><div class="card"><div class="label">Pedidos pendentes</div><div id="kp" class="num">0</div></div><div class="card"><div class="label">Posições</div><div id="ka" class="num">0</div></div></section><section class="panel"><h2>Inventário atual</h2><table><thead><tr><th>SKU</th><th>Item</th><th>Edifício</th><th>Posição</th><th>Lote</th><th>Quantidade</th></tr></thead><tbody id="stock"></tbody></table></section></main><script>const URL='https://wqhxzzvlxkhcogxqurlk.supabase.co',KEY='sb_publishable_8XtQPhzITuD5AuGHJ0DfQQ_iM5PAZ0w',db=window.supabase.createClient(URL,KEY),$=x=>document.getElementById(x);let I=[],P=[],E=[],O=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function item(id){return I.find(x=>x.id===id)}function addr(id){return P.find(x=>x.id===id)}async function guard(){try{const {data:{session},error}=await db.auth.getSession();if(error)throw error;if(!session){location.replace('login.html');return false}const {data:p,error:pe}=await db.from('perfis').select('perfil').eq('user_id',session.user.id).maybeSingle();if(pe)throw pe;if(!p){await db.auth.signOut();location.replace('login.html');return false}if(p.perfil!=='ADMINISTRADOR'){location.replace('operador.html');return false}return true}catch(e){$('status').innerHTML='<span class="err">Erro ao validar acesso: '+esc(e.message)+'</span>';return false}}async function load(){try{$('status').textContent='Carregando dados...';const rs=await Promise.all([db.from('produtos').select('*').order('nome'),db.from('enderecos').select('*').order('codigo'),db.from('estoque').select('*'),db.from('pedidos').select('*').order('created_at',{ascending:false})]);const bad=rs.find(x=>x.error);if(bad)throw bad.error;[I,P,E,O]=rs.map(x=>x.data||[]);$('ki').textContent=I.length;$('ka').textContent=P.length;$('ke').textContent=E.reduce((a,x)=>a+Number(x.quantidade||0),0).toLocaleString('pt-BR');$('kp').textContent=O.filter(x=>!['SEPARADO','CANCELADO'].includes(x.status)).length;$('stock').innerHTML=E.filter(x=>Number(x.quantidade)>0).map(x=>{let p=item(x.produto_id),a=addr(x.endereco_id);return '<tr><td><b>'+esc(p?.sku||'-')+'</b></td><td>'+esc(p?.nome||'-')+'</td><td>'+esc(a?.edificio||'-')+'</td><td>'+esc(a?.codigo||a?.posicao||'-')+'</td><td>'+esc(x.lote||'-')+'</td><td><b>'+Number(x.quantidade||0).toLocaleString('pt-BR')+'</b></td></tr>'}).join('');$('status').textContent='● Conectado • Administrador'}catch(e){console.error(e);$('status').innerHTML='<span class="err">Erro ao carregar dados: '+esc(e.message)+'</span>'}}async function logout(){await db.auth.signOut();location.replace('login.html')}(async()=>{if(await guard())await load()})();</script></body></html>
