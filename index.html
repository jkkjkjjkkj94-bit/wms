<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WMS • Administração</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#15171a;font:12.5px Inter,Segoe UI,Arial,sans-serif}.top{height:58px;background:#111315;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{font-weight:800}.brand b{display:inline-grid;place-items:center;width:30px;height:30px;background:#ffc800;color:#111;border-radius:8px;margin-right:9px}.logout,.btn,.ghost{appearance:none;border:1px solid #e4b700;background:#ffc800;color:#111;border-radius:10px;height:42px;padding:0 18px;font:800 12px Inter,Segoe UI,Arial,sans-serif;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}.btn:hover,.ghost:hover,.logout:hover{transform:translateY(-1px);box-shadow:0 5px 14px #00000012}.logout{height:36px;border-color:#333;background:#1b1d20;color:#ddd}.ghost{background:#fff;border-color:#dfe3e8;font-weight:750}.wrap{max-width:1200px;margin:auto;padding:30px 20px}.status,.muted{font-size:11px;color:#777}.status{margin:7px 0 22px;min-height:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card,.panel{background:#fff;border:1px solid #e5e8ec;border-radius:14px;padding:18px}.card:before{content:'';display:block;width:26px;height:4px;background:#ffc800;border-radius:5px;margin-bottom:14px}.num{font-size:25px;font-weight:850}.label{font-size:9px;color:#777;text-transform:uppercase;font-weight:800}.panel{margin-top:18px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;border-bottom:1px solid #eee;padding:11px;font-size:11px}th{font-size:9px;color:#777;text-transform:uppercase}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0}.actions>.btn,.actions>.ghost{min-width:170px}.err{color:#c43b35}.hide{display:none!important}.memberActions{display:flex;gap:7px;align-items:center}.memberActions select{border:1px solid #ddd;border-radius:8px;padding:8px;background:#fff;font:inherit}.memberActions .ghost{height:34px;min-width:120px;padding:0 12px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:20}.modal.hide{display:none!important}.box{width:min(420px,100%);background:#fff;border-radius:15px;padding:22px}.box input{width:100%;border:1px solid #ddd;border-radius:9px;padding:11px;margin:9px 0 14px}.box h2{margin-top:0}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#fff6c9;font-size:9px;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:20px 13px}.actions{display:grid;grid-template-columns:1fr}.actions>.btn,.actions>.ghost{width:100%;min-width:0}.memberActions{align-items:stretch;flex-direction:column}.memberActions .ghost{width:100%}}</style></head><body><header class="top"><div class="brand"><b>W</b>WMS • Administração</div><button class="logout" onclick="logout()">Sair</button></header><main class="wrap"><section id="dashboard" class="hide"><h1>Dashboard</h1><div id="status" class="status">Carregando...</div><div class="actions"><button class="btn" onclick="location.href='mobile.html'">Central de Bipagem</button><button class="ghost" onclick="showMembers()">Membros</button></div><section class="grid"><div class="card"><div class="label">Itens</div><div id="ki" class="num">0</div></div><div class="card"><div class="label">Estoque</div><div id="ke" class="num">0</div></div><div class="card"><div class="label">Pedidos pendentes</div><div id="kp" class="num">0</div></div><div class="card"><div class="label">Posições</div><div id="ka" class="num">0</div></div></section><section class="panel"><h2>Inventário atual</h2><table><thead><tr><th>SKU</th><th>Item</th><th>Edifício</th><th>Posição</th><th>Lote</th><th>Quantidade</th></tr></thead><tbody id="stock"></tbody></table></section></section><section id="members" class="hide"><div class="actions"><button class="ghost" onclick="showDashboard()">← Voltar</button></div><h1>Membros</h1><p class="muted">Gerencie cargos e redefina senhas. Somente administradores têm acesso a esta tela.</p><section class="panel"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Cargo</th><th>Ações</th></tr></thead><tbody id="memberRows"><tr><td colspan="4">Carregando...</td></tr></tbody></table></section></section></main><div id="pwModal" class="modal hide"><div class="box"><h2>Alterar senha</h2><div id="pwName" class="muted"></div><input id="newPassword" type="password" minlength="6" placeholder="Nova senha (mín. 6 caracteres)"><div class="actions"><button class="btn" onclick="savePassword()">Salvar nova senha</button><button class="ghost" onclick="closePassword()">Cancelar</button></div></div></div><script>const URL='https://wqhxzzvlxkhcogxqurlk.supabase.co',KEY='sb_publishable_8XtQPhzITuD5AuGHJ0DfQQ_iM5PAZ0w',db=window.supabase.createClient(URL,KEY),$=x=>document.getElementById(x);let I=[],P=[],E=[],O=[],MEM=[],pwUser=null;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function item(id){return I.find(x=>x.id===id)}function addr(id){return P.find(x=>x.id===id)}async function guard(){try{const {data:{session},error}=await db.auth.getSession();if(error)throw error;if(!session){location.replace('login.html');return false}const {data:p,error:pe}=await db.from('perfis').select('perfil').eq('user_id',session.user.id).maybeSingle();if(pe)throw pe;if(!p){await db.auth.signOut();location.replace('login.html');return false}if(p.perfil!=='ADMINISTRADOR'){location.replace('operador.html');return false}return true}catch(e){alert('Erro ao validar acesso: '+e.message);return false}}async function load(){try{$('dashboard').classList.remove('hide');$('status').textContent='Carregando dados...';const rs=await Promise.all([db.from('produtos').select('*').order('nome'),db.from('enderecos').select('*').order('codigo'),db.from('estoque').select('*'),db.from('pedidos').select('*').order('created_at',{ascending:false})]);const bad=rs.find(x=>x.error);if(bad)throw bad.error;[I,P,E,O]=rs.map(x=>x.data||[]);$('ki').textContent=I.length;$('ka').textContent=P.length;$('ke').textContent=E.reduce((a,x)=>a+Number(x.quantidade||0),0).toLocaleString('pt-BR');$('kp').textContent=O.filter(x=>!['SEPARADO','CANCELADO'].includes(x.status)).length;$('stock').innerHTML=E.filter(x=>Number(x.quantidade)>0).map(x=>{let p=item(x.produto_id),a=addr(x.endereco_id);return '<tr><td><b>'+esc(p?.sku||'-')+'</b></td><td>'+esc(p?.nome||'-')+'</td><td>'+esc(a?.edificio||'-')+'</td><td>'+esc(a?.codigo||a?.posicao||'-')+'</td><td>'+esc(x.lote||'-')+'</td><td><b>'+Number(x.quantidade||0).toLocaleString('pt-BR')+'</b></td></tr>'}).join('');$('status').textContent='● Conectado • Administrador'}catch(e){$('status').innerHTML='<span class="err">Erro ao carregar dados: '+esc(e.message)+'</span>'}}async function adminCall(body){const {data,error}=await db.functions.invoke('admin-members',{body});if(error)throw error;if(data?.error)throw new Error(data.error);return data}function showDashboard(){$('members').classList.add('hide');$('dashboard').classList.remove('hide')}async function showMembers(){$('dashboard').classList.add('hide');$('members').classList.remove('hide');$('memberRows').innerHTML='<tr><td colspan="4">Carregando...</td></tr>';try{const d=await adminCall({action:'list'});MEM=d.members||[];renderMembers()}catch(e){$('memberRows').innerHTML='<tr><td colspan="4" class="err">'+esc(e.message)+'</td></tr>'}}function renderMembers(){$('memberRows').innerHTML=MEM.map(m=>'<tr><td><b>'+esc(m.nome||'Sem nome')+'</b></td><td>'+esc(m.email||'-')+'</td><td><span class="badge">'+esc(m.perfil)+'</span></td><td><div class="memberActions"><select onchange="changeRole(\''+m.user_id+'\',this.value)"><option value="OPERADOR" '+(m.perfil==='OPERADOR'?'selected':'')+'>Operador</option><option value="ADMINISTRADOR" '+(m.perfil==='ADMINISTRADOR'?'selected':'')+'>Administrador</option></select><button class="ghost" onclick="openPassword(\''+m.user_id+'\')">Alterar senha</button></div></td></tr>').join('')||'<tr><td colspan="4">Nenhum membro.</td></tr>'}async function changeRole(id,perfil){try{await adminCall({action:'role',user_id:id,perfil});let m=MEM.find(x=>x.user_id===id);if(m)m.perfil=perfil;renderMembers()}catch(e){alert(e.message);showMembers()}}function openPassword(id){pwUser=id;let m=MEM.find(x=>x.user_id===id);$('pwName').textContent=(m?.nome||'Usuário')+' • '+(m?.email||'');$('newPassword').value='';$('pwModal').classList.remove('hide');$('newPassword').focus()}function closePassword(){pwUser=null;$('pwModal').classList.add('hide')}async function savePassword(){let password=$('newPassword').value;if(password.length<6)return alert('A senha precisa ter pelo menos 6 caracteres.');try{await adminCall({action:'password',user_id:pwUser,password});closePassword();alert('Senha alterada com sucesso.')}catch(e){alert(e.message)}}async function logout(){await db.auth.signOut();location.replace('login.html')}(async()=>{if(await guard())await load()})();</script></body></html>
