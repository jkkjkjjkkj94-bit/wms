<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WMS • Acesso</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f9;color:#15171a;font:13px Inter,Segoe UI,Arial,sans-serif}.box{width:min(390px,calc(100% - 28px));background:#fff;border:1px solid #e7e9ed;border-radius:18px;padding:28px;box-shadow:0 24px 70px #1111}.brand{display:flex;align-items:center;font-size:18px;font-weight:800;margin-bottom:26px}.logo{display:grid;place-items:center;width:38px;height:38px;background:#ffc800;border-radius:10px;margin-right:10px;color:#111}.sub{color:#7d8593;font-size:11px;margin:5px 0 22px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f3f4f6;border-radius:10px;padding:3px;margin-bottom:20px}.tabs button{border:0;background:transparent;padding:9px;border-radius:8px;font-weight:700;color:#737b86}.tabs button.on{background:#fff;color:#111;box-shadow:0 2px 8px #0000000c}.field{margin:12px 0}.field label{display:block;font-size:9px;text-transform:uppercase;font-weight:800;color:#626a75;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #dde1e6;border-radius:10px;outline:none}.field input:focus{border-color:#d5b21c;box-shadow:0 0 0 3px #ffc80018}.btn{width:100%;border:1px solid #e5b800;background:#ffc800;border-radius:10px;padding:12px;font-weight:800;margin-top:8px;cursor:pointer}.msg{font-size:11px;margin-top:13px;min-height:16px;color:#c43b35}.note{font-size:10px;color:#8a919b;line-height:1.5;margin-top:18px}.hide{display:none}</style></head><body><main class="box"><div class="brand"><span class="logo">W</span><div>WMS<div class="sub" style="margin:2px 0 0">Centro de Distribuição</div></div></div><div class="tabs"><button id="tLogin" class="on" onclick="mode('login')">Entrar</button><button id="tSign" onclick="mode('signup')">Criar conta</button></div><form id="login"><div class="field"><label>E-mail</label><input id="le" type="email" required autocomplete="email"></div><div class="field"><label>Senha</label><input id="lp" type="password" required autocomplete="current-password"></div><button class="btn">Entrar</button></form><form id="signup" class="hide"><div class="field"><label>Nome</label><input id="sn" required></div><div class="field"><label>E-mail</label><input id="se" type="email" required autocomplete="email"></div><div class="field"><label>Senha</label><input id="sp" type="password" minlength="6" required autocomplete="new-password"></div><button class="btn">Criar conta</button><div class="note">Novas contas são criadas como <b>Operador</b>. O perfil Administrador deve ser concedido pelo responsável do sistema.</div></form><div id="msg" class="msg"></div></main><script>const db=supabase.createClient('https://wqhxzzvlxkhcogxqurlk.supabase.co','sb_publishable_8XtQPhzITuD5AuGHJ0DfQQ_iM5PAZ0w');const $=x=>document.getElementById(x);function mode(m){$('login').classList.toggle('hide',m!=='login');$('signup').classList.toggle('hide',m!=='signup');$('tLogin').classList.toggle('on',m==='login');$('tSign').classList.toggle('on',m==='signup');$('msg').textContent=''}async function route(user){let {data:p,error}=await db.from('perfis').select('perfil').eq('user_id',user.id).single();if(error){$('msg').textContent='Não foi possível carregar o perfil.';return}location.href=p.perfil==='ADMINISTRADOR'?'index.html':'operador.html'}$('login').onsubmit=async e=>{e.preventDefault();$('msg').textContent='Entrando...';let {data,error}=await db.auth.signInWithPassword({email:$('le').value.trim(),password:$('lp').value});if(error){$('msg').textContent=error.message;return}route(data.user)};$('signup').onsubmit=async e=>{e.preventDefault();$('msg').textContent='Criando conta...';let {data,error}=await db.auth.signUp({email:$('se').value.trim(),password:$('sp').value,options:{data:{nome:$('sn').value.trim()}}});if(error){$('msg').textContent=error.message;return}if(!data.session){$('msg').textContent='Conta criada, mas a confirmação de e-mail ainda está habilitada no projeto.';return}route(data.user)};(async()=>{let {data:{session}}=await db.auth.getSession();if(session)route(session.user)})();</script></body></html>
