.item=p;let rows=flow.uz?UI.filter(x=>x.uz_id===flow.uz.id&&x.produto_id===p.id):ST.filter(x=>x.endereco_id===flow.end.id&&!x.uz_id&&x.produto_id===p.id);flow.sistema=rows.reduce((n,x)=>n+Number(x.quantidade||0),0);flow.lote=rows[0]?.lote||''}else if(key==='invqtd'){let q=Number(v);if(q<0||!Number.isFinite(q))return fail('Quantidade inválida.');flow.qtd=q}else if(key==='cend'){let a=findAddress(v);if(!a)return fail('Endereço não encontrado.');flow.end=a}else if(key==='cuz'){let u=uz(v);if(!u||u.status!=='ATIVA')return fail('UZ não encontrada ou inativa.');flow.uz=u}else if(key==='citem'){let p=findProduct(v);if(!p)return fail('Produto não encontrado.');flow.item=p;let line=uzItems(flow.uz.id).find(x=>x.produto_id===p.id);flow.uzLine=line||null;flow.lote=line?.lote||''}else if(key==='cqtd'){let q=Number(v);if(q<0||!Number.isFinite(q))return fail('Quantidade inválida.');flow.qtd=q}feedback(true,'Bipagem confirmada');next()}async function execute(){try{let r;if(flow.op==='entrada')r=await db.rpc('wms_uz_receber',{p_uz:flow.uzCode,p_produto:flow.item.id,p_quantidade:flow.qtd,p_destino:flow.dest.id,p_lote:flow.lote||null,p_validade:flow.validade||null,p_fornecedor:flow.forn||null});else if(flow.op==='transferencia')r=await db.rpc('wms_uz_mover',{p_uz:flow.uz.codigo,p_destino:flow.dest.id});else if(flow.op==='saida'){if(flow.uz)r=await db.rpc('wms_uz_baixar',{p_uz:flow.uz.codigo,p_produto:flow.item.id,p_quantidade:flow.qtd});else r=await db.rpc('wms_baixar_estoque_auto',{p_produto:flow.item.id,p_quantidade:flow.qtd,p_endereco:flow.end.id,p_motivo:flow.motivo})}else if(flow.op==='inventario')r=await db.rpc('wms_registrar_inventario_auto',{p_endereco:flow.end.id,p_produto:flow.item.id,p_quantidade_contada:flow.qtd,p_uz:flow.uz?flow.uz.codigo:null,p_lote:flow.lote||null});else r=await db.rpc('wms_contagem_ciclica',{p_endereco:flow.end.id,p_uz_encontrada:flow.uz.codigo,p_produto:flow.item.id,p_quantidade_contada:flow.qtd,p_lote:flow.lote||null});if(r.error)throw r.error;feedb
