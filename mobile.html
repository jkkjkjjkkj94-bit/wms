const $=x=>document.getElementById(x),db=window.supabase.createClient('https://wqhxzzvlxkhcogxqurlk.supabase.co','sb_publishable_8XtQPhzITuD5AuGHJ0DfQQ_iM5PAZ0w');let I=[],A=[],F=[],UZ=[],UI=[],ST=[],ORD=[],LINES=[],flow={},currentOrder=null;const plans={entrada:['uznew','item','qtd','lote','validade','forn','dest','confirm'],transferencia:['uz','dest','confirm'],saida:['outend','outuz','outitem','outqtd','confirm'],inventario:['invend','invuz','invitem','invqtd','confirm'],ciclica:['cend','cuz','citem','cqtd','confirm']};
function beep(ok=true){try{let C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?880:220;g.gain.value=.05;o.start();o.stop(c.currentTime+(ok?0.07:0.16))}catch(e){}}function feedback(ok,msg){beep(ok);toast(msg,ok?'ok':'err')}function toast(t,k=''){let d=document.createElement('div');d.className='toast '+k;d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}function fail(t){feedback(false,t);return false}function hideAll(){['home','work','ordersPage','pickPage'].forEach(x=>$(x).classList.add('hide'))}function home(){hideAll();$('home').classList.remove('hide');flow={};currentOrder=null}function prod(id){return I.find(x=>x.id===id)}function address(id){return A.find(x=>x.id===id)}function uz(code){return UZ.find(x=>String(x.codigo).toLowerCase()===String(code).toLowerCase())}function uzItems(id){return UI.filter(x=>x.uz_id===id&&Number(x.quantidade)>0)}function findProduct(v){v=String(v).toLowerCase();return I.find(x=>String(x.sku).toLowerCase()===v||String(x.ean||'').toLowerCase()===v)}function findAddress(v){v=String(v).toLowerCase();return A.find(x=>String(x.codigo||x.posicao).toLowerCase()===v)}function handling(p){return p?.tipo_manuseio==='POR_QUANTIDADE'?'Por quantidade • máx. '+Number(p.quantidade_manuseio||1):'Unitário • 1 por bipagem'}function qtyValid(p,q){if(!(q>0))return'Quantidade inválida.';if(p?.tipo_manuseio!=='POR_QUANTIDADE'&&q!==1)return'Item unitário: quantidade deve ser 1.';let m=Number(p?.quantidade_manuseio||1);if(q>m)return'Máximo por bipagem: '+m;return''}function activeUZ(a){return UZ.filter(x=>x.endereco_id===a.id&&x.status==='ATIVA')}function start(op){flow={op,step:0,uz:null,item:null,dest:null,end:null,qtd:1,lote:'',validade:'',forn:'',motivo:''};hideAll();$('work').classList.remove('hide');$('tag').textContent={entrada:'RECEBIMENTO',transferencia:'MOVIMENTAR UZ',saida:'BAIXA',inventario:'INVENTÁRIO',ciclica:'CONTAGEM CÍCLICA'}[op];draw()}function next(){flow.step++;draw()}function summary(u=flow.uz){if(!u)return'';return'<div class="uzbox"><b>UZ '+u.codigo+'</b><br>Endereço: '+(address(u.endereco_id)?.codigo||'-')+'<br>'+uzItems(u.id).map(x=>{let p=prod(x.produto_id);return(p?.sku||'-')+' • '+(p?.nome||'Item')+' — '+Number(x.quantidade)+' • '+(x.validade?'validade '+x.validade:'sem validade')}).join('<br>')+'</div>'}
function draw(){let key=plans[flow.op][flow.step],h='',n=flow.step+1;if(key==='uznew')h='<label>Bipe/digite a UZ</label><input id="v" autofocus placeholder="Etiqueta UZ">';if(key==='uz')h='<label>Bipe a UZ existente</label><input id="v" autofocus>';if(key==='item')h='<label>Bipe SKU / EAN</label><input id="v" autofocus>';if(key==='qtd')h='<div class="info">'+handling(flow.item)+'</div><label>Quantidade</label><input id="v" autofocus type="number" value="'+(flow.item?.tipo_manuseio==='POR_QUANTIDADE'?'':'1')+'">';if(key==='lote')h='<label>Lote</label><input id="v" autofocus>';if(key==='validade')h='<label>Validade</label><input id="v" autofocus type="date">';if(key==='forn')h='<label>Fornecedor</label><select id="v"><option value="">Selecione</option>'+F.filter(x=>x.ativo!==false).map(x=>'<option>'+x.nome+'</option>').join('')+'</select>';if(key==='dest')h=(flow.sug?'<div class="suggest"><b>Endereço sugerido:</b> '+flow.sug.codigo+'</div>':'')+summary()+'<label>Bipe o destino</label><input id="v" autofocus>';if(key==='outend'||key==='invend'||key==='cend')h='<label>Bipe o endereço</label><input id="v" autofocus>';if(key==='outuz'||key==='invuz')h='<div class="info">Endereço possui UZ. Bipe a UZ física.</div><label>UZ</label><input id="v" autofocus>';if(key==='outitem'||key==='invitem')h=(flow.uz?summary():'<div class="info">Operação sem UZ.</div>')+'<label>Bipe o produto</label><input id="v" autofocus>';if(key==='outqtd')h='<div class="info"><b>Saldo:</b> '+flow.saldo+'<br>'+handling(flow.item)+'</div><label>Quantidade</label><input id="v" autofocus type="number" value="'+(flow.item?.tipo_manuseio==='POR_QUANTIDADE'?'':'1')+'"><label>Motivo</label><input id="mot">';if(key==='invqtd')h='<div class="info"><b>Sistema:</b> '+flow.sistema+'</div><label>Quantidade física</label><input id="v" autofocus type="number" min="0">';if(key==='cuz')h='<div class="info">UZ esperadas: '+(activeUZ(flow.end).map(x=>x.codigo).join(', ')||'Nenhuma')+'</div><label>UZ encontrada</label><input id="v" autofocus>';if(key==='citem')h=summary()+'<label>Produto encontrado</label><input id="v" autofocus>';if(key==='cqtd')h='<div class="info">'+handling(flow.item)+'</div><label>Quantidade física</label><input id="v" autofocus type="number" min="0">';if(key==='confirm'){h='<div class="info"><b>Confirmar operação</b><br>'+(flow.uz?'UZ: '+flow.uz.codigo+'<br>':'')+(flow.item?'Produto: '+flow.item.nome+'<br>':'')+(flow.qtd!=null?'Quantidade: '+flow.qtd:'')+'</div><button class="btn" onclick="execute()">Confirmar e registrar</button>'+(flow.op==='entrada'||flow.op==='saida'?'<button class="btn secondary" onclick="home()">Finalizar sessão</button>':'')}$('stage').innerHTML='<div class="step"><div class="n">'+n+'</div><div class="body">'+h+(key==='confirm'?'':'<button class="btn" onclick="validate()">Continuar</button>')+'</div></div>';setTimeout(()=>{let v=$('v');if(v){v.focus();v.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();validate()}}}},30)}
async function suggest(){try{let r=await db.rpc('wms_sugerir_endereco',{p_produto:flow.item.id,p_quantidade:flow.qtd});if(!r.error&&r.data){let id=typeof r.data==='string'?r.data:r.data?.id;flow.sug=A.find(x=>x.id===id)||null}}catch(e){}}
async function validate(){let key=plans[flow.op][flow.step],v=String($('v')?.value||'').trim();if(key==='uznew'){if(!v)return fail('UZ obrigatória.');flow.uzCode=v.toUpperCase();flow.uz=uz(v)||null}else if(key==='uz'){let u=uz(v);if(!u||u.status!=='ATIVA')return fail('UZ não encontrada ou inativa.');flow.uz=u}else if(key==='item'){let p=findProduct(v);if(!p||p.ativo===false)return fail('Item inválido.');flow.item=p}else if(key==='qtd'){let q=Number(v),er=qtyValid(flow.item,q);if(er)return fail(er);flow.qtd=q;await suggest()}else if(key==='lote')flow.lote=v;else if(key==='validade'){if(flow.item.controla_validade&&!v)return fail('Validade obrigatória para este item.');flow.validade=v}else if(key==='forn')flow.forn=v;else if(key==='dest'){let a=findAddress(v);if(!a||a.ativo===false||String(a.status).toLowerCase()==='bloqueado')return fail('Endereço inválido ou bloqueado.');flow.dest=a}else if(key==='outend'||key==='invend'){let a=findAddress(v);if(!a||a.ativo===false)return fail('Endereço inválido.');flow.end=a;flow.expectedUZ=activeUZ(a);if(!flow.expectedUZ.length){flow.step=2;feedback(true,'Endereço sem UZ');return draw()}}else if(key==='outuz'||key==='invuz'){let u=flow.expectedUZ.find(x=>String(x.codigo).toLowerCase()===v.toLowerCase());if(!u)return fail('UZ não pertence ao endereço.');flow.uz=u}else if(key==='outitem'){let p=findProduct(v);if(!p)return fail('Produto inválido.');let rows=ST.filter(x=>x.produto_id===p.id&&x.endereco_id===flow.end.id&&Number(x.quantidade)>0&&(flow.uz?x.uz_id===flow.uz.id:!x.uz_id));flow.saldo=rows.reduce((s,x)=>s+Number(x.quantidade),0);if(!flow.saldo)return fail('Sem saldo disponível.');flow.item=p}else if(key==='outqtd'){let q=Number(v),er=qtyValid(flow.item,q);if(er)return fail(er);if(q>flow.saldo)return fail('Quantidade maior que o saldo.');flow.qtd=q;flow.motivo=$('mot').value.trim()||'BAIXA DE ESTOQUE'}else if(key==='invitem'){let p=findProduct(v);if(!p)return fail('Produto inválido.');flow.item=p;let rows=flow.uz?UI.filter(x=>x.uz_id===flow.uz.id&&x.produto_id===p.id):ST.filter(x=>x.endereco_id===flow.end.id&&!x.uz_id&&x.produto_id===p.id);flow.sistema=rows.reduce((s,x)=>s+Number(x.quantidade||0),0);flow.lote=rows[0]?.lote||''}else if(key==='invqtd'||key==='cqtd'){let q=Number(v);if(q<0||!Number.isFinite(q))return fail('Quantidade inválida.');flow.qtd=q}else if(key==='cend'){let a=findAddress(v);if(!a)return fail('Endereço inválido.');flow.end=a}else if(key==='cuz'){let u=uz(v);if(!u||u.status!=='ATIVA')return fail('UZ inválida.');flow.uz=u}else if(key==='citem'){let p=findProduct(v);if(!p)return fail('Produto inválido.');flow.item=p;let line=uzItems(flow.uz.id).find(x=>x.produto_id===p.id);flow.lote=line?.lote||''}feedback(true,'Bipagem confirmada');next()}
async function execute(){try{let r;if(flow.op==='entrada')r=await db.rpc('wms_uz_receber',{p_uz:flow.uzCode,p_produto:flow.item.id,p_quantidade:flow.qtd,p_destino:flow.dest.id,p_lote:flow.lote||null,p_validade:flow.validade||null,p_fornecedor:flow.forn||null});else if(flow.op==='transferencia')r=await db.rpc('wms_uz_mover',{p_uz:flow.uz.codigo,p_destino:flow.dest.id});else if(flow.op==='saida')r=flow.uz?await db.rpc('wms_uz_baixar',{p_uz:flow.uz.codigo,p_produto:flow.item.id,p_quantidade:flow.qtd}):await db.rpc('wms_baixar_estoque_auto',{p_produto:flow.item.id,p_quantidade:flow.qtd,p_endereco:flow.end.id,p_motivo:flow.motivo});else if(flow.op==='inventario')r=await db.rpc('wms_registrar_inventario_auto',{p_endereco:flow.end.id,p_produto:flow.item.id,p_quantidade_contada:flow.qtd,p_uz:flow.uz?flow.uz.codigo:null,p_lote:flow.lote||null});else r=await db.rpc('wms_contagem_ciclica',{p_endereco:flow.end.id,p_uz_encontrada:flow.uz.codigo,p_produto:flow.item.id,p_quantidade_contada:flow.qtd,p_lote:flow.lote||null});if(r.error)throw r.error;feedback(true,'Registrado com sucesso');let old={...flow};await load();if(old.op==='entrada'){let u=uz(old.uzCode);flow={op:'entrada',step:1,uz:u,uzCode:old.uzCode,item:null,qtd:1,lote:'',validade:'',forn:old.forn,dest:old.dest};draw()}else if(old.op==='saida'){let ku=old.uz?uz(old.uz.codigo):null;flow={op:'saida',step:2,uz:ku,item:null,end:old.end,qtd:1,motivo:'',expectedUZ:activeUZ(old.end)};if(flow.expectedUZ.length&&!ku)flow.step=1;draw()}else home()}catch(e){fail(e.message||'Erro na operação')}}
async function loadOrders(){let[a,b]=await Promise.all([db.from('pedidos').select('*').order('created_at',{ascending:false}),db.from('pedido_itens').select('*')]);if(a.error)throw a.error;if(b.error)throw b.error;ORD=a.data||[];LINES=b.data||[]}
async function openOrders(){try{await loadOrders();hideAll();$('ordersPage').classList.remove('hide');let p=ORD.filter(o=>!['CANCELADO','CONFERIDO'].includes(String(o.status||'').toUpperCase()));$('orders').innerHTML=p.map(o=>'<button class="order" onclick="openPick(\''+o.id+'\')"><div class="orderTop"><strong>Pedido '+o.numero+'</strong><span class="badge">'+(o.status||'PENDENTE')+'</span></div><div class="progress">'+(String(o.status).toUpperCase()==='SEPARADO'?'Pronto para conferência':'Separação')+'</div></button>').join('')||'<div class="card">Nenhum pedido pendente.</div>'}catch(e){fail(e.message)}}function openPick(id){currentOrder=ORD.find(o=>o.id===id);hideAll();$('pickPage').classList.remove('hide');$('pickTitle').textContent='Pedido '+currentOrder.numero;renderPick()}
function fefoHint(p){let rows=ST.filter(x=>x.produto_id===p.id&&Number(x.quantidade)>0&&(!x.validade||x.validade>=new Date().toISOString().slice(0,10))).sort((a,b)=>(a.validade||'9999').localeCompare(b.validade||'9999'));let x=rows[0];if(!x)return'';return'<div class="suggest"><b>FEFO sugerido:</b> '+(address(x.endereco_id)?.codigo||'-')+(x.uz_id?' • UZ '+(UZ.find(u=>u.id===x.uz_id)?.codigo||'-'):'')+' • validade '+(x.validade||'sem validade')+'</div>'}
function renderPick(){let ls=LINES.filter(l=>l.pedido_id===currentOrder.id),conf=String(currentOrder.status||'').toUpperCase()==='SEPARADO';$('pickLines').innerHTML=ls.map(l=>{let p=prod(l.produto_id),left=Math.max(0,Number(l.quantidade)-Number(l.quantidade_separada||0)),cq=Number(l.quantidade_conferida||0);if(conf)return'<div class="order"><strong>'+p.sku+' • '+p.nome+'</strong><div class="progress">Separado: '+l.quantidade_separada+' • Conferido: '+cq+'</div><label>Bipe o produto para conferir</label><input id="cit_'+l.id+'"><label>Quantidade conferida</label><input id="cqt_'+l.id+'" type="number" min="1" value="1"><button class="btn" onclick="checkPick(\''+l.id+'\')">Conferir</button></div>';return'<div class="order"><strong>'+p.sku+' • '+p.nome+'</strong><div class="progress">Falta: '+left+'</div>'+fefoHint(p)+(left?'<label>Endereço</label><input id="pend_'+l.id+'"><label>UZ quando houver</label><input id="puz_'+l.id+'"><label>Produto</label><input id="pit_'+l.id+'"><label>Quantidade</label><input id="pqt_'+l.id+'" type="number" min="1" value="1"><button class="btn" onclick="pick(\''+l.id+'\')">Separar</button>':'<div class="info">Separado ✓</div>')+'</div>'}).join('')}
async function pick(id){try{let l=LINES.find(x=>x.id===id),p=prod(l.produto_id),a=findAddress($('pend_'+id).value.trim()),uc=$('puz_'+id).value.trim(),fp=findProduct($('pit_'+id).value.trim()),q=Number($('pqt_'+id).value),er=qtyValid(p,q);if(!a)return fail('Endereço inválido.');if(er)return fail(er);if(!fp||fp.id!==p.id)return fail('Produto incorreto.');let au=activeUZ(a),u=null;if(au.length){u=au.find(x=>String(x.codigo).toLowerCase()===uc.toLowerCase());if(!u)return fail('UZ inválida para este endereço.')}let r=await db.rpc('wms_separar_pedido_origem',{p_item:id,p_endereco:a.id,p_uz:u?u.codigo:null,p_quantidade:q});if(r.error)throw r.error;feedback(true,'Separação registrada');await Promise.all([load(),loadOrders()]);currentOrder=ORD.find(o=>o.id===currentOrder.id);renderPick()}catch(e){fail(e.message)}}
async function checkPick(id){try{let l=LINES.find(x=>x.id===id),p=prod(l.produto_id),fp=findProduct($('cit_'+id).value.trim()),q=Number($('cqt_'+id).value);if(!fp||fp.id!==p.id)return fail('Produto incorreto na conferência.');if(!(q>0))return fail('Quantidade inválida.');let r=await db.rpc('wms_conferir_pedido',{p_item:id,p_quantidade:q});if(r.error)throw r.error;feedback(true,'Conferência registrada');await loadOrders();currentOrder=ORD.find(o=>o.id===currentOrder.id);if(String(currentOrder?.status||'').toUpperCase()==='CONFERIDO')openOrders();else renderPick()}catch(e){fail(e.message)}}
async function guard(){const{data:{session}}=await db.auth.getSession();if(!session){location.replace('login.html');return false}let r=await db.from('perfis').select('perfil').eq('user_id',session.user.id).maybeSingle();if(!r.data){location.replace('login.html');return false}return true}async function load(){try{$('status').textContent='Carregando...';let rs=await Promise.all([db.from('produtos').select('*').order('nome'),db.from('enderecos').select('*').order('codigo'),db.from('fornecedores').select('*').order('nome'),db.from('uz_paletes').select('*'),db.from('uz_itens').select('*'),db.from('estoque').select('*')]),bad=rs.find(x=>x.error);if(bad)throw bad.error;[I,A,F,UZ,UI,ST]=rs.map(x=>x.data||[]);$('status').textContent='● Conectado'}catch(e){$('status').textContent='● Erro';fail(e.message)}}(async()=>{try{if(await guard())await load()}catch(e){fail(e.message)}})();
</script></body></html>
