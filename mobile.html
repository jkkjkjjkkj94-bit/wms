<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WMS • Modo Celular</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script><style>:root{--y:#f5c400;--b:#111;--bg:#f5f6f7;--line:#e3e4e6;--muted:#74777c;--r:#c43b35;--g:#17875d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--b);font:15px Inter,Segoe UI,Arial,sans-serif}.top{position:sticky;top:0;z-index:5;background:#111;color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850}.brand span{display:inline-grid;place-items:center;background:var(--y);color:#111;width:32px;height:32px;border-radius:8px;margin-right:8px}.status{font-size:11px;color:#aaa}.wrap{padding:16px;max-width:640px;margin:auto}h1{font-size:22px;margin:5px 0}.sub{color:var(--muted);font-size:12px;margin:6px 0 20px}.ops{display:grid;grid-template-columns:1fr 1fr;gap:12px}.op,.card{background:#fff;border:1px solid var(--line);border-radius:14px}.op{padding:18px;text-align:left;min-height:120px}.op:before{content:'';display:block;width:32px;height:6px;background:var(--y);border-radius:8px;margin-bottom:18px}.op strong{display:block;font-size:16px;margin-bottom:7px}.op small{color:var(--muted)}.card{padding:18px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.tag{background:#fff7ce;border-radius:30px;padding:7px 10px;font-size:11px;font-weight:850}.back{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px;font-weight:700}.step{display:flex;gap:12px}.n{flex:0 0 34px;height:34px;border-radius:9px;background:#111;color:#fff;display:grid;place-items:center;font-weight:850}.body{width:100%}label{display:block;font-size:11px;font-weight:850;margin-bottom:8px}input,select{width:100%;padding:15px;border:1px solid #d8dadd;border-radius:10px;background:#fff;font-size:16px;outline:none}.btn{width:100%;margin-top:14px;border:0;border-radius:10px;background:var(--y);padding:14px;font-weight:850;font-size:15px}.info{margin-top:10px;padding:12px;background:#f4f4f4;border-radius:9px;font-size:12px;line-height:1.5}.suggest{background:#fffbea;border:1px solid #eadb8c}.addr{font-size:18px;font-weight:850}.err{color:var(--r)}.ok{color:var(--g)}.hide{display:none}.toast{position:fixed;left:14px;right:14px;bottom:18px;background:#111;color:#fff;padding:13px 15px;border-radius:10px;z-index:20}@media(max-width:380px){.ops{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand"><span>W</span>WMS Mobile</div><div id="status" class="status">Conectando...</div></header><main class="wrap"><section id="home"><h1>Central de Bipagem</h1><div class="sub">Escolha a operação para iniciar. O modo celular mostra somente funções operacionais.</div><div class="ops"><button class="op" onclick="startOp('entrada')"><strong>Recebimento</strong><small>Receber e armazenar material</small></button><button class="op" onclick="startOp('transferencia')"><strong>Mover posição</strong><small>Transferir material no estoque</small></button><button class="op" onclick="startOp('saida')"><strong>Baixa de estoque</strong><small>Retirar material da posição</small></button><button class="op" onclick="startOp('contagem')"><strong>Inventário</strong><small>Contagem física por posição</small></button></div></section><section id="work" class="hide"><div class="card"><div class="head"><span id="tag" class="tag"></span><button class="back" onclick="home()">Trocar operação</button></div><div id="stage"></div></div></section></main><script>const $=x=>document.getElementById(x);let db,I=[],P=[],E=[],F=[],flow={};const plans={entrada:['item','qtd','lote','validade','forn','dest','confirm'],transferencia:['item','orig','qtd','dest','confirm'],saida:['item','orig','qtd','confirm'],contagem:['item','orig','qtd','confirm']};function toast(t,e=false){let d=document.createElement('div');d.className='toast';d.textContent=t;if(e)d.style.borderLeft='4px solid #c43b35';document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}function item(id){return I.find(x=>x.id===id)}function addr(id){return P.find(x=>x.id===id)}function occ(id){return E.filter(x=>x.endereco_id===id).reduce((a,x)=>a+Number(x.quantidade||0),0)}function bal(pid,eid){return E.filter(x=>x.produto_id===pid&&x.endereco_id===eid).reduce((a,x)=>a+Number(x.quantidade||0),0)}function same(p,a){return String(p?.edificio||'').trim().toLowerCase()===String(a?.edificio||'').trim().toLowerCase()}function statusOf(a){return String(a?.status||'DISPONIVEL').toUpperCase()}function available(a,q=0){let c=Number(a.capacidade||0);return a.ativo!==false&&statusOf(a)==='DISPONIVEL'&&(!c||c-occ(a.id)>=q)}function suggest(q){return P.filter(a=>flow.item&&same(flow.item,a)&&available(a,q)).sort((a,b)=>Number(a.prioridade??100)-Number(b.prioridade??100)||((bal(flow.item.id,a.id)>0?0:1)-(bal(flow.item.id,b.id)>0?0:1)))[0]}function home(){$('home').classList.remove('hide');$('work').classList.add('hide');flow={}}function startOp(op){flow={op,step:0,item:null,orig:null,dest:null,qtd:1,lote:'',validade:'',forn:''};$('home').classList.add('hide');$('work').classList.remove('hide');$('tag').textContent={entrada:'RECEBIMENTO',transferencia:'MOVER POSIÇÃO',saida:'BAIXA',contagem:'INVENTÁRIO'}[op];draw()}function next(){flow.step++;draw()}function draw(){let key=plans[flow.op][flow.step],h='',n=flow.step+1;if(key==='item')h='<label>Bipe o SKU / EAN</label><input id="v" autofocus inputmode="text" placeholder="SKU ou código de barras"><div id="preview"></div>';if(key==='orig')h='<label>Bipe a posição de origem</label><input id="v" autofocus placeholder="Endereço físico">';if(key==='qtd')h='<label>'+(flow.op==='contagem'?'Quantidade contada':'Quantidade')+'</label><input id="v" autofocus type="number" min="0.001" step="any" inputmode="decimal">';if(key==='lote')h='<label>Lote</label><input id="v" autofocus placeholder="Lote do material">';if(key==='validade')h='<label>Validade</label><input id="v" autofocus type="date">';if(key==='forn')h='<label>Fornecedor</label><select id="v"><option value="">Selecione</option>'+F.filter(x=>x.ativo!==false).map(x=>'<option>'+String(x.nome).replace(/</g,'&lt;')+'</option>').join('')+'</select>';if(key==='dest'){let s=suggest(Number(flow.qtd));h='<label>Bipe a posição de destino</label><input id="v" autofocus placeholder="Endereço físico">'+(s?'<div class="info suggest">Endereço recomendado<div class="addr">'+(s.codigo||s.posicao)+'</div><small>'+s.edificio+'</small></div>':'<div class="info err">Nenhuma posição disponível no mesmo edifício.</div>')}if(key==='confirm')h='<label>Confirmar operação</label><div class="info"><b>'+flow.item.nome+'</b><br>Quantidade: '+flow.qtd+(flow.orig?'<br>Origem: '+(flow.orig.codigo||flow.orig.posicao):'')+(flow.dest?'<br>Destino: '+(flow.dest.codigo||flow.dest.posicao):'')+'</div><button class="btn" onclick="execute()">Confirmar e registrar</button>';$('stage').innerHTML='<div class="step"><div class="n">'+n+'</div><div class="body">'+h+(key==='confirm'?'':'<button class="btn" onclick="validate()">Continuar</button>')+'</div></div>';let v=$('v');if(v){v.focus();v.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();validate()}});if(key==='item')v.addEventListener('input',preview)}}function preview(){let v=$('v').value.trim().toLowerCase(),p=I.find(x=>String(x.sku).toLowerCase()===v||String(x.ean||'').toLowerCase()===v);$('preview').innerHTML=p?'<div class="info"><b>'+p.nome+'</b><br>'+(p.descricao||'Sem descrição')+'<br>Edifício: '+(p.edificio||'-')+'</div>':''}function validate(){let key=plans[flow.op][flow.step],v=String($('v')?.value||'').trim();if(key==='item'){let p=I.find(x=>String(x.sku).toLowerCase()===v.toLowerCase()||String(x.ean||'').toLowerCase()===v.toLowerCase());if(!p)return toast('Item não encontrado.',true);flow.item=p;return next()}if(key==='orig'){let a=P.find(x=>String(x.codigo||x.posicao).toLowerCase()===v.toLowerCase());if(!a)return toast('Posição não encontrada.',true);if(!same(flow.item,a))return toast('Posição de outro edifício.',true);if(['BLOQUEADA','MANUTENCAO','AVARIA'].includes(statusOf(a)))return toast('Posição indisponível.',true);if(flow.op!=='contagem'&&bal(flow.item.id,a.id)<=0)return toast('Sem saldo nesta posição.',true);flow.orig=a;return next()}if(key==='qtd'){let q=Number(v);if(!(q>0))return toast('Quantidade inválida.',true);if(flow.orig&&flow.op!=='contagem'&&q>bal(flow.item.id,flow.orig.id))return toast('Quantidade maior que o saldo.',true);flow.qtd=q;return next()}if(key==='lote'){flow.lote=v;return next()}if(key==='validade'){flow.validade=v;return next()}if(key==='forn'){if(!v)return toast('Selecione o fornecedor.',true);flow.forn=v;return next()}if(key==='dest'){let a=P.find(x=>String(x.codigo||x.posicao).toLowerCase()===v.toLowerCase());if(!a)return toast('Posição não encontrada.',true);if(!same(flow.item,a))return toast('Destino de outro edifício.',true);if(!available(a,flow.qtd))return toast('Posição indisponível ou sem capacidade.',true);if(flow.orig&&flow.orig.id===a.id)return toast('Origem e destino são iguais.',true);flow.dest=a;return next()}}async function execute(){try{let r;if(flow.op==='entrada')r=await db.rpc('wms_receber',{p_produto:flow.item.id,p_quantidade:flow.qtd,p_destino:flow.dest.id,p_lote:flow.lote||null,p_validade:flow.validade||null,p_documento:null,p_fornecedor:flow.forn||null,p_observacao:'Recebimento WMS Mobile'});else if(flow.op==='transferencia')r=await db.rpc('wms_movimentar',{p_produto:flow.item.id,p_tipo:'TRANSFERENCIA',p_quantidade:flow.qtd,p_origem:flow.orig.id,p_destino:flow.dest.id,p_lote:null,p_documento:null,p_observacao:'Transferência WMS Mobile'});else if(flow.op==='saida')r=await db.rpc('wms_movimentar',{p_produto:flow.item.id,p_tipo:'SAIDA',p_quantidade:flow.qtd,p_origem:flow.orig.id,p_destino:null,p_lote:null,p_documento:null,p_observacao:'Baixa WMS Mobile'});else{let sys=bal(flow.item.id,flow.orig.id),dif=flow.qtd-sys;if(dif===0){toast('Contagem sem divergência.');await load();return home()}r=await db.rpc('wms_movimentar',{p_produto:flow.item.id,p_tipo:dif>0?'AJUSTE_ENTRADA':'AJUSTE_SAIDA',p_quantidade:Math.abs(dif),p_origem:dif<0?flow.orig.id:null,p_destino:dif>0?flow.orig.id:null,p_lote:null,p_documento:null,p_observacao:'Inventário WMS Mobile'})}if(r.error)throw r.error;toast('Operação concluída.');await load();home()}catch(e){toast(e.message||'Erro na operação.',true)}}async function load(){try{let rs=await Promise.all([db.from('produtos').select('*').order('nome'),db.from('enderecos').select('*').order('codigo'),db.from('estoque').select('*'),db.from('fornecedores').select('*').order('nome')]);let bad=rs.find(x=>x.error);if(bad)throw bad.error;[I,P,E,F]=rs.map(x=>x.data||[]);$('status').textContent='● Conectado'}catch(e){$('status').textContent='● Erro';toast(e.message,true)}}function init(){try{db=window.supabase.createClient('https://wqhxzzvlxkhcogxqurlk.supabase.co','sb_publishable_8XtQPhzITuD5AuGHJ0DfQQ_iM5PAZ0w');load()}catch(e){$('status').textContent='● Erro';toast('Falha ao iniciar.',true)}}init();</script></body></html>
