<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WMS • Modo Celular</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script><style>:root{--y:#f5c400;--b:#111;--bg:#f5f6f7;--line:#e3e4e6;--muted:#74777c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--b);font:15px Inter,Segoe UI,Arial,sans-serif}.top{position:sticky;top:0;z-index:5;background:#111;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850}.brand span{display:inline-grid;place-items:center;background:var(--y);color:#111;width:32px;height:32px;border-radius:8px;margin-right:8px}.status{font-size:11px;color:#aaa}.wrap{padding:16px;max-width:680px;margin:auto}h1{font-size:22px;margin:5px 0}.sub,.muted{color:var(--muted);font-size:12px}.sub{margin:6px 0 20px}.ops{display:grid;grid-template-columns:1fr 1fr;gap:12px}.op,.card,.order{background:#fff;border:1px solid var(--line);border-radius:14px}.op{padding:18px;text-align:left;min-height:118px;cursor:pointer}.op:before{content:'';display:block;width:32px;height:6px;background:var(--y);border-radius:8px;margin-bottom:17px}.op strong{display:block;font-size:16px;margin-bottom:7px}.card{padding:18px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.tag,.badge{background:#fff4bd;border-radius:30px;padding:7px 10px;font-size:10px;font-weight:850}.back{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px;font-weight:700}.step{display:flex;gap:12px}.n{flex:0 0 34px;height:34px;border-radius:9px;background:#111;color:#fff;display:grid;place-items:center;font-weight:850}.body{width:100%}label{display:block;font-size:11px;font-weight:850;margin:12px 0 8px}input,select{width:100%;padding:15px;border:1px solid #d8dadd;border-radius:10px;background:#fff;font-size:16px}.btn{width:100%;margin-top:14px;border:0;border-radius:10px;background:var(--y);padding:14px;font-weight:850;font-size:15px}.info,.uzbox{margin-top:10px;padding:12px;background:#f4f4f4;border-radius:9px;font-size:12px;line-height:1.55}.uzbox{border:1px solid #eadb8c;background:#fffbea}.hide{display:none}.toast{position:fixed;left:14px;right:14px;bottom:18px;background:#111;color:#fff;padding:13px 15px;border-radius:10px;z-index:20}.orders{display:grid;gap:10px}.order{padding:14px}.orderTop{display:flex;justify-content:space-between;gap:10px}.progress{font-size:11px;color:var(--muted);margin-top:5px}@media(max-width:420px){.ops{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand"><span>W</span>WMS Mobile</div><div id="status" class="status">Validando...</div></header><main class="wrap"><section id="home"><h1>Central de Bipagem</h1><div class="sub">Operações rastreadas por endereço e UZ.</div><div class="ops"><button class="op" onclick="start('entrada')"><strong>Recebimento</strong><small>Receber produto em uma UZ</small></button><button class="op" onclick="start('transferencia')"><strong>Mover UZ</strong><small>Mover o palete inteiro</small></button><button class="op" onclick="location.href='baixa.html'"><strong>Baixa de Estoque</strong><small>Bipar endereço e identificar UZ automaticamente</small></button><button class="op" onclick="start('inventario')"><strong>Inventário por UZ</strong><small>Contar conteúdo do palete</small></button><button class="op" onclick="start('ciclica')"><strong>Contagem Cíclica</strong><small>Conferir endereço e UZ física</small></button><button class="op" onclick="openOrders()"><strong>Separar pedidos</strong><small>Separação pela UZ de origem</small></button></div></section><section id="work" class="hide"><div class="card"><div class="head"><span id="tag" class="tag"></span><button class="back" onclick="home()">Trocar operação</button></div><div id="stage"></div></div></section><section id="ordersPage" class="hide"><div class="head"><div><h1>Separar pedidos</h1><div class="sub">Selecione um pedido pendente.</div></div><button class="back" onclick="home()">Voltar</button></div><div id="orders" class="orders"></div></section><section id="pickPage" class="hide"><div class="head"><div><h1 id="pickTitle">Pedido</h1><div class="sub">Bipe a UZ e o produto.</div></div><button class="back" onclick="openOrders()">Pedidos</button></div><div id="pickLines" class="orders"></div></section></main><script>const $=x=>document.getElementById(x),db=window.supabase.createClient('https://wqhxzzvlxkhcogxqurlk.supabase.co','sb_publishable_8XtQPhzITuD5AuGHJ0DfQQ_iM5PAZ0w');let I=[],A=[],F=[],UZ=[],UI=[],ORD=[],LINES=[],flow={},currentOrder=null;const plans={entrada:['uznew','item','qtd','lote','validade','forn','dest','confirm'],transferencia:['uz','dest','confirm'],saida:['uz','uzitem','qtd','confirm'],inventario:['uz','invend','invitem','invqtd','confirm'],ciclica:['cend','cuz','citem','cqtd','confirm']};function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}function hideAll(){['home','work','ordersPage','pickPage'].forEach(x=>$(x).classList.add('hide'))}function home(){hideAll();$('home').classList.remove('hide');flow={};currentOrder=null}function prod(id){return I.find(x=>x.id===id)}function address(id){return A.find(x=>x.id===id)}function uz(code){return UZ.find(x=>String(x.codigo).toLowerCase()===String(code).toLowerCase())}function uzItems(id){return UI.filter(x=>x.uz_id===id&&Number(x.quantidade)>0)}function findProduct(v){v=String(v).toLowerCase();return I.find(x=>String(x.sku).toLowerCase()===v||String(x.ean||'').toLowerCase()===v)}function findAddress(v){v=String(v).toLowerCase();return A.find(x=>String(x.codigo||x.posicao).toLowerCase()===v)}function handling(p){return p?.tipo_manuseio==='POR_QUANTIDADE'?'Por quantidade • máx. '+Number(p.quantidade_manuseio||1):'Unitário • 1 por bipagem'}function qtyValid(p,q){if(!(q>0))return'Quantidade inválida.';if(p?.tipo_manuseio!=='POR_QUANTIDADE'&&q!==1)return'Item unitário: quantidade deve ser 1.';let m=Number(p?.quantidade_manuseio||1);if(q>m)return'Limite de manuseio: máximo '+m+'.';return''}function start(op){flow={op,step:0,uz:null,item:null,dest:null,end:null,qtd:1,lote:'',validade:'',forn:''};hideAll();$('work').classList.remove('hide');$('tag').textContent={entrada:'RECEBIMENTO COM UZ',transferencia:'MOVIMENTAR UZ',saida:'BAIXA POR UZ',inventario:'INVENTÁRIO POR UZ',ciclica:'CONTAGEM CÍCLICA'}[op];draw()}function next(){flow.step++;draw()}function summary(u=flow.uz){if(!u)return'';let its=uzItems(u.id);return'<div class="uzbox"><b>UZ '+u.codigo+'</b><br>Endereço sistema: '+(address(u.endereco_id)?.codigo||'-')+'<br>'+its.map(x=>{let p=prod(x.produto_id);return(p?.sku||'-')+' • '+(p?.nome||'Item')+' — '+Number(x.quantidade)+' • lote '+(x.lote||'-')}).join('<br>')+'</div>'}function draw(){let key=plans[flow.op][flow.step],h='',n=flow.step+1;if(key==='uznew')h='<label>Bipe/digite a UZ</label><input id="v" autofocus placeholder="Etiqueta UZ">';if(key==='uz')h='<label>Bipe a UZ existente</label><input id="v" autofocus placeholder="Etiqueta UZ">';if(key==='item')h='<label>Bipe SKU / EAN</label><input id="v" autofocus placeholder="Produto">';if(key==='uzitem')h=summary()+'<label>Bipe o produto que será baixado</label><input id="v" autofocus placeholder="SKU / EAN">';if(key==='qtd')h='<div class="info">'+handling(flow.item)+'</div><label>Quantidade</label><input id="v" autofocus type="number" min="1" step="1" value="'+(flow.item?.tipo_manuseio==='POR_QUANTIDADE'?'':'1')+'">';if(key==='lote')h='<label>Lote</label><input id="v" autofocus>';if(key==='validade')h='<label>Validade</label><input id="v" autofocus type="date">';if(key==='forn')h='<label>Fornecedor</label><select id="v"><option value="">Selecione</option>'+F.filter(x=>x.ativo!==false).map(x=>'<option>'+x.nome+'</option>').join('')+'</select>';if(key==='dest')h=summary()+'<label>Bipe o endereço de destino</label><input id="v" autofocus placeholder="Endereço">';if(key==='invend')h=summary()+'<label>Bipe o endereço físico onde a UZ está</label><input id="v" autofocus placeholder="Endereço">';if(key==='invitem')h=summary()+'<label>Bipe o produto contado</label><input id="v" autofocus placeholder="SKU / EAN">';if(key==='invqtd')h='<div class="info">Sistema: '+Number(flow.uzLine?.quantidade||0)+' • '+handling(flow.item)+'</div><label>Quantidade física contada</label><input id="v" autofocus type="number" min="0">';if(key==='cend')h='<label>Bipe o endereço que será contado</label><input id="v" autofocus placeholder="Endereço">';if(key==='cuz'){let exp=UZ.filter(u=>u.endereco_id===flow.end.id&&u.status==='ATIVA');h='<div class="info">UZ esperada: '+(exp.map(u=>u.codigo).join(', ')||'Nenhuma')+'</div><label>Bipe a UZ encontrada fisicamente</label><input id="v" autofocus placeholder="UZ encontrada">'}if(key==='citem')h=summary()+'<label>Bipe o produto encontrado</label><input id="v" autofocus placeholder="SKU / EAN">';if(key==='cqtd')h='<div class="info">'+handling(flow.item)+'</div><label>Quantidade física contada</label><input id="v" autofocus type="number" min="0">';if(key==='confirm'){let info='';if(flow.op==='entrada')info='<b>UZ:</b> '+flow.uzCode+'<br><b>Produto:</b> '+flow.item.nome+'<br><b>Quantidade:</b> '+flow.qtd+'<br><b>Lote:</b> '+(flow.lote||'-')+'<br><b>Validade:</b> '+(flow.validade||'-')+'<br><b>Fornecedor:</b> '+(flow.forn||'-')+'<br><b>Endereço:</b> '+flow.dest.codigo;else if(flow.op==='transferencia')info=summary()+'<br><b>Novo destino:</b> '+flow.dest.codigo;else if(flow.op==='saida')info=summary()+'<br><b>Baixar:</b> '+flow.item.nome+' • '+flow.qtd;else if(flow.op==='inventario')info=summary()+'<br><b>Endereço contado:</b> '+flow.end.codigo+'<br><b>Produto:</b> '+flow.item.nome+'<br><b>Sistema:</b> '+Number(flow.uzLine?.quantidade||0)+' • <b>Contado:</b> '+flow.qtd+' • <b>Diferença:</b> '+(flow.qtd-Number(flow.uzLine?.quantidade||0));else info='<b>Endereço:</b> '+flow.end.codigo+'<br><b>UZ encontrada:</b> '+flow.uz.codigo+'<br><b>Produto:</b> '+flow.item.nome+'<br><b>Contado:</b> '+flow.qtd;h='<label>Confirmar operação</label><div class="info">'+info+'</div><button class="btn" onclick="execute()">Confirmar e registrar</button>'}$('stage').innerHTML='<div class="step"><div class="n">'+n+'</div><div class="body">'+h+(key==='confirm'?'':'<button class="btn" onclick="validate()">Continuar</button>')+'</div></div>';let v=$('v');if(v){v.focus();v.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();validate()}}}}async function validate(){let key=plans[flow.op][flow.step],v=String($('v')?.value||'').trim();if(key==='uznew'){if(!v)return toast('UZ obrigatória.');flow.uzCode=v.toUpperCase();let ex=uz(v);if(ex&&ex.status!=='ATIVA')return toast('UZ existe, mas está inativa.');if(ex)flow.uz=ex}else if(key==='uz'){let u=uz(v);if(!u||u.status!=='ATIVA')return toast('UZ não encontrada ou inativa.');flow.uz=u}else if(key==='item'){let p=findProduct(v);if(!p||p.ativo===false)return toast('Item não encontrado ou inativo.');flow.item=p}else if(key==='uzitem'){let p=findProduct(v);if(!p)return toast('Item não encontrado.');let line=uzItems(flow.uz.id).find(x=>x.produto_id===p.id);if(!line)return toast('Produto não pertence à UZ.');flow.item=p;flow.uzLine=line}else if(key==='qtd'){let q=Number(v),er=qtyValid(flow.item,q);if(er)return toast(er);if(flow.op==='saida'&&q>Number(flow.uzLine.quantidade))return toast('Quantidade maior que o saldo da UZ.');flow.qtd=q}else if(key==='lote')flow.lote=v;else if(key==='validade')flow.validade=v;else if(key==='forn')flow.forn=v;else if(key==='dest'){let a=findAddress(v);if(!a||a.ativo===false||String(a.status).toLowerCase()==='bloqueado')return toast('Endereço inválido ou bloqueado.');flow.dest=a}else if(key==='invend'){let a=findAddress(v);if(!a)return toast('Endereço não encontrado.');flow.end=a}else if(key==='invitem'){let p=findProduct(v);if(!p)return toast('Produto não encontrado.');let line=uzItems(flow.uz.id).find(x=>x.produto_id===p.id);if(!line)return toast('Produto não pertence à UZ.');flow.item=p;flow.uzLine=line;flow.lote=line.lote||''}else if(key==='invqtd'){let q=Number(v);if(q<0||!Number.isFinite(q))return toast('Quantidade inválida.');flow.qtd=q}else if(key==='cend'){let a=findAddress(v);if(!a)return toast('Endereço não encontrado.');flow.end=a}else if(key==='cuz'){let u=uz(v);if(!u||u.status!=='ATIVA')return toast('UZ não encontrada ou inativa.');flow.uz=u}else if(key==='citem'){let p=findProduct(v);if(!p)return toast('Produto não encontrado.');flow.item=p;let line=uzItems(flow.uz.id).find(x=>x.produto_id===p.id);flow.uzLine=line||null;flow.lote=line?.lote||''}else if(key==='cqtd'){let q=Number(v);if(q<0||!Number.isFinite(q))return toast('Quantidade inválida.');flow.qtd=q}next()}async function execute(){try{let r;if(flow.op==='entrada')r=await db.rpc('wms_uz_receber',{p_uz:flow.uzCode,p_produto:flow.item.id,p_quantidade:flow.qtd,p_destino:flow.dest.id,p_lote:flow.lote||null,p_validade:flow.validade||null,p_fornecedor:flow.forn||null});else if(flow.op==='transferencia')r=await db.rpc('wms_uz_mover',{p_uz:flow.uz.codigo,p_destino:flow.dest.id});else if(flow.op==='saida')r=await db.rpc('wms_uz_baixar',{p_uz:flow.uz.codigo,p_produto:flow.item.id,p_quantidade:flow.qtd});else if(flow.op==='inventario')r=await db.rpc('wms_registrar_inventario_uz',{p_uz:flow.uz.codigo,p_endereco:flow.end.id,p_produto:flow.item.id,p_quantidade_contada:flow.qtd,p_lote:flow.lote||null});else r=await db.rpc('wms_contagem_ciclica',{p_endereco:flow.end.id,p_uz_encontrada:flow.uz.codigo,p_produto:flow.item.id,p_quantidade_contada:flow.qtd,p_lote:flow.lote||null});if(r.error)throw r.error;toast(flow.op==='inventario'||flow.op==='ciclica'?'Contagem registrada. Divergências ficam pendentes.':'Operação concluída com UZ.');await load();home()}catch(e){toast(e.message||'Erro na operação.')}}async function loadOrders(){let[a,b]=await Promise.all([db.from('pedidos').select('*').order('created_at',{ascending:false}),db.from('pedido_itens').select('*')]);if(a.error)throw a.error;if(b.error)throw b.error;ORD=a.data||[];LINES=b.data||[]}async function openOrders(){try{await loadOrders();hideAll();$('ordersPage').classList.remove('hide');let p=ORD.filter(o=>!['SEPARADO','CANCELADO'].includes(String(o.status||'').toUpperCase()));$('orders').innerHTML=p.map(o=>'<button class="order" onclick="openPick(\''+o.id+'\')"><div class="orderTop"><strong>Pedido '+o.numero+'</strong><span class="badge">'+(o.status||'PENDENTE')+'</span></div></button>').join('')||'<div class="card">Nenhum pedido pendente.</div>'}catch(e){toast(e.message)}}function openPick(id){currentOrder=ORD.find(o=>o.id===id);hideAll();$('pickPage').classList.remove('hide');$('pickTitle').textContent='Pedido '+currentOrder.numero;renderPick()}function renderPick(){let ls=LINES.filter(l=>l.pedido_id===currentOrder.id);$('pickLines').innerHTML=ls.map(l=>{let p=prod(l.produto_id),left=Math.max(0,Number(l.quantidade)-Number(l.quantidade_separada||0)),q=p?.tipo_manuseio==='POR_QUANTIDADE'?Math.min(left,Number(p.quantidade_manuseio||1)):1;return'<div class="order"><strong>'+(p?.sku||'-')+' • '+(p?.nome||'Item')+'</strong><div class="progress">Falta: '+left+' • '+handling(p)+'</div>'+(left?'<label>UZ de origem</label><input id="puz_'+l.id+'" placeholder="Bipe a UZ"><label>Produto</label><input id="pit_'+l.id+'" placeholder="Bipe SKU/EAN"><label>Quantidade</label><input id="pqt_'+l.id+'" type="number" min="1" value="'+q+'"><button class="btn" onclick="pick(\''+l.id+'\')">Separar</button>':'<div class="info">Concluído ✓</div>')+'</div>'}).join('')}async function pick(id){try{let l=LINES.find(x=>x.id===id),p=prod(l.produto_id),uc=$('puz_'+id).value.trim(),pv=$('pit_'+id).value.trim(),q=Number($('pqt_'+id).value),u=uz(uc),er=qtyValid(p,q),left=Number(l.quantidade)-Number(l.quantidade_separada||0);if(er)return toast(er);if(q>left)return toast('Quantidade maior que o restante do pedido.');if(!u||u.status!=='ATIVA')return toast('UZ inválida.');let fp=findProduct(pv);if(!fp||fp.id!==p.id)return toast('Produto incorreto.');let ul=uzItems(u.id).find(x=>x.produto_id===p.id);if(!ul||Number(ul.quantidade)<q)return toast('Saldo insuficiente nesta UZ.');let r=await db.rpc('wms_uz_baixar',{p_uz:u.codigo,p_produto:p.id,p_quantidade:q});if(r.error)throw r.error;let sep=Number(l.quantidade_separada||0)+q,u1=await db.from('pedido_itens').update({quantidade_separada:sep}).eq('id',id);if(u1.error)throw u1.error;l.quantidade_separada=sep;let done=LINES.filter(x=>x.pedido_id===currentOrder.id).every(x=>Number(x.quantidade_separada||0)>=Number(x.quantidade));let u2=await db.from('pedidos').update({status:done?'SEPARADO':'EM_SEPARACAO'}).eq('id',currentOrder.id);if(u2.error)throw u2.error;toast(done?'Pedido separado.':'Separação registrada.');await load();if(done)openOrders();else renderPick()}catch(e){toast(e.message)}}async function guard(){const{data:{session},error}=await db.auth.getSession();if(error)throw error;if(!session){location.replace('login.html');return false}let r=await db.from('perfis').select('perfil').eq('user_id',session.user.id).maybeSingle();if(r.error)throw r.error;if(!r.data){location.replace('login.html');return false}return true}async function load(){try{$('status').textContent='Carregando...';let rs=await Promise.all([db.from('produtos').select('*').order('nome'),db.from('enderecos').select('*').order('codigo'),db.from('fornecedores').select('*').order('nome'),db.from('uz_paletes').select('*'),db.from('uz_itens').select('*')]),bad=rs.find(x=>x.error);if(bad)throw bad.error;[I,A,F,UZ,UI]=rs.map(x=>x.data||[]);$('status').textContent='● Conectado'}catch(e){$('status').textContent='● Erro';toast(e.message)}}(async()=>{try{if(await guard())await load()}catch(e){$('status').textContent='● Erro';toast(e.message)}})();</script></body></html>
