<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WMS • Modo Celular</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script><style>:root{--y:#f5c400;--ink:#111216;--bg:#f2f3f5;--line:#e2e4e8;--muted:#737780;--panel:#fff;--dark:#17181b;--ok:#177245;--err:#b42318}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 100% 0,#fff7c7 0,transparent 28%),var(--bg);color:var(--ink);font:15px Inter,Segoe UI,Arial,sans-serif;min-height:100vh}.top{position:sticky;top:0;z-index:5;background:#17181bf5;color:#fff;padding:10px 14px;min-height:58px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850}.brand span{display:inline-grid;place-items:center;background:var(--y);color:#111;width:32px;height:32px;border-radius:9px;margin-right:9px}.status{font-size:9px;color:#b7bac1;text-transform:uppercase}.wrap{padding:22px 14px 42px;max-width:680px;margin:auto}h1{font-size:26px;margin:5px 0}.sub,.progress{color:var(--muted);font-size:11px}.sub{margin:7px 0 22px}.ops{display:grid;grid-template-columns:1fr 1fr;gap:10px}.op,.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 7px 22px #11182708}.op{padding:17px;text-align:left;min-height:112px;cursor:pointer;position:relative}.op:before{content:'';display:block;width:28px;height:3px;background:var(--y);border-radius:3px;margin-bottom:18px}.op strong{display:block;font-size:15px;margin-bottom:7px}.op small{color:#777b84;font-size:11px}.card{padding:17px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.tag{background:#fff7ce;border:1px solid #f1da65;border-radius:6px;padding:6px 8px;font-size:9px;font-weight:850}.back{border:1px solid #d9dce1;background:#fff;border-radius:8px;padding:9px 11px;font-weight:750}.step{display:flex;gap:12px}.n{flex:0 0 32px;height:32px;border-radius:8px;background:#18191d;color:#fff;display:grid;place-items:center;font-weight:850}.body{width:100%}label{display:block;font-size:9px;font-weight:850;margin:13px 0 7px;color:#60646c;text-transform:uppercase}input,select{width:100%;padding:15px 14px;border:1px solid #d7dae0;border-radius:9px;background:#fff;font-size:17px;outline:0}input:focus,select:focus{border-color:#17181b;box-shadow:0 0 0 4px #f5c4002d}.btn{width:100%;margin-top:12px;border:1px solid #18191d;border-radius:9px;background:#18191d;color:#fff;padding:15px;font-weight:850}.btn.secondary{background:#fff;color:#222;border-color:#d9dce1}.info,.uzbox{margin-top:10px;padding:12px;background:#f6f7f8;border:1px solid #e6e8eb;border-radius:8px;font-size:12px;line-height:1.6}.uzbox{background:#fffbea;border-color:#f0df8c}.hide{display:none}.toast{position:fixed;left:14px;right:14px;bottom:18px;background:#191a1e;color:#fff;padding:14px;border-radius:10px;z-index:20}.toast.ok{background:#176c45}.toast.err{background:#a8322a}@media(max-width:340px){.ops{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand"><span>W</span>WMS Mobile</div><div id="status" class="status">Validando...</div></header><main class="wrap"><section id="home"><h1>Central de Bipagem</h1><div class="sub">Scanner rápido • UZ • FEFO • rastreabilidade</div><div class="ops"><button class="op" onclick="start('entrada')"><strong>Recebimento</strong><small>Sessão contínua na mesma UZ</small></button><button class="op" onclick="start('transferencia')"><strong>Mover UZ</strong><small>Mover palete inteiro</small></button><button class="op" onclick="start('saida')"><strong>Baixa de Estoque</strong><small>Endereço → UZ → produto</small></button><button class="op" onclick="start('inventario')"><strong>Inventário</strong><small>Contagem física</small></button><button class="op" onclick="start('ciclica')"><strong>Contagem Cíclica</strong><small>Conferência de UZ</small></button><button class="op" onclick="startRepo()"><strong>Reposição</strong><small>Abastecer somente endereços PICKING</small></button><button class="op" onclick="location.href='operador.html'"><strong>Pedidos</strong><small>Separação e conferência</small></button></div></section><section id="work" class="hide"><div class="card"><div class="head"><span id="tag" class="tag"></span><button class="back" onclick="home()">Trocar</button></div><div id="stage"></div></div></section><section id="repo" class="hide"><div class="head"><div><h1>Reposição</h1><div class="sub">Origem → UZ → Produto → Quantidade → PICKING</div></div><button class="back" onclick="home()">Voltar</button></div><div class="card"><div class="head"><span class="tag">REPOSIÇÃO</span><span id="repoProgress" class="progress"></span></div><div id="repoStage"></div></div></section></main><script>const $=x=>document.getElementById(x),db=window.supabase.createClient('https://wqhxzzvlxkhcogxqurlk.supabase.co','sb_publishable_8XtQPhzITuD5AuGHJ0DfQQ_iM5PAZ0w');let I=[],A=[],F=[],UZ=[],UI=[],ST=[],flow={},rf={};const plans={entrada:['uznew','item','qtd','lote','validade','forn','dest','confirm'],transferencia:['uz','dest','confirm'],saida:['outend','outuz','outitem','outqtd','confirm'],inventario:['invend','invuz','invitem','invqtd','confirm'],ciclica:['cend','cuz','citem','cqtd','confirm']};function beep(ok=true){try{let C=AudioContext||webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?880:220;g.gain.value=.05;o.start();o.stop(c.currentTime+.08)}catch(e){}}function toast(t,k=''){let d=document.createElement('div');d.className='toast '+k;d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}function feedback(ok,t){beep(ok);toast(t,ok?'ok':'err')}function fail(t){feedback(false,t);return false}function hideAll(){['home','work','repo'].forEach(x=>$(x).classList.add('hide'))}function home(){hideAll();$('home').classList.remove('hide');flow={};rf={}}function prod(id){return I.find(x=>x.id===id)}function address(id){return A.find(x=>x.id===id)}function uz(code){return UZ.find(x=>String(x.codigo).toLowerCase()===String(code).toLowerCase())}function uzItems(id){return UI.filter(x=>x.uz_id===id&&Number(x.quantidade)>0)}function findProduct(v){v=String(v).toLowerCase();return I.find(x=>String(x.sku).toLowerCase()===v||String(x.ean||'').toLowerCase()===v)}function findAddress(v){v=String(v).toLowerCase();return A.find(x=>String(x.codigo||x.posicao).toLowerCase()===v)}function activeUZ(a){return UZ.filter(x=>x.endereco_id===a.id&&x.status==='ATIVA')}function handling(p){return p?.tipo_manuseio==='POR_QUANTIDADE'?'Por quantidade • máx. '+Number(p.quantidade_manuseio||1):'Unitário • 1 por bipagem'}function qtyValid(p,q){if(!(q>0))return'Quantidade inválida.';if(p?.tipo_manuseio!=='POR_QUANTIDADE'&&q!==1)return'Item unitário: quantidade deve ser 1.';let m=Number(p?.quantidade_manuseio||1);if(q>m)return'Máximo por bipagem: '+m;return''}function summary(u){return u?'<div class="uzbox"><b>UZ '+u.codigo+'</b><br>Endereço: '+(address(u.endereco_id)?.codigo||'-')+'<br>'+uzItems(u.id).map(x=>{let p=prod(x.produto_id);return(p?.sku||'-')+' • '+(p?.nome||'Item')+' — '+Number(x.quantidade)}).join('<br>')+'</div>':''}function start(op){flow={op,step:0,uz:null,item:null,dest:null,end:null,qtd:1};hideAll();$('work').classList.remove('hide');$('tag').textContent={entrada:'RECEBIMENTO',transferencia:'MOVIMENTAR UZ',saida:'BAIXA',inventario:'INVENTÁRIO',ciclica:'CONTAGEM CÍCLICA'}[op];draw()}function draw(){let key=plans[flow.op][flow.step],h='';if(key==='uznew'||key==='uz')h='<label>Bipe a UZ</label><input id="v" autofocus>';if(key==='item')h='<label>Bipe SKU / EAN</label><input id="v" autofocus>';if(key==='qtd'||key==='outqtd'||key==='invqtd'||key==='cqtd')h='<label>Quantidade</label><input id="v" type="number" autofocus>';if(key==='lote')h='<label>Lote</label><input id="v" autofocus>';if(key==='validade')h='<label>Validade</label><input id="v" type="date" autofocus>';if(key==='forn')h='<label>Fornecedor</label><select id="v">'+F.map(x=>'<option>'+x.nome+'</option>').join('')+'</select>';if(key==='dest')h=summary(flow.uz)+'<label>Bipe o destino</label><input id="v" autofocus>';if(['outend','invend','cend'].includes(key))h='<label>Bipe o endereço</label><input id="v" autofocus>';if(['outuz','invuz','cuz'].includes(key))h='<label>Bipe a UZ</label><input id="v" autofocus>';if(['outitem','invitem','citem'].includes(key))h=summary(flow.uz)+'<label>Bipe o produto</label><input id="v" autofocus>';if(key==='confirm')h='<div class="info"><b>Confirmar operação</b></div><button class="btn" onclick="execute()">Confirmar e registrar</button>';$('stage').innerHTML='<div class="step"><div class="n">'+(flow.step+1)+'</div><div class="body">'+h+(key==='confirm'?'':'<button class="btn" onclick="validate()">Continuar</button>')+'</div></div>';setTimeout(()=>{let v=$('v');if(v){v.focus();v.onkeydown=e=>{if(e.key==='Enter')validate()}}},30)}async function validate(){let key=plans[flow.op][flow.step],v=String($('v')?.value||'').trim();if(key==='uznew'){if(!v)return fail('UZ obrigatória.');flow.uzCode=v.toUpperCase();flow.uz=uz(v)||null}else if(key==='uz'){let u=uz(v);if(!u||u.status!=='ATIVA')return fail('UZ inválida.');flow.uz=u}else if(['item','outitem','invitem','citem'].includes(key)){let p=findProduct(v);if(!p)return fail('Produto inválido.');flow.item=p}else if(['qtd','outqtd','invqtd','cqtd'].includes(key)){let q=Number(v);if(q<0||!Number.isFinite(q))return fail('Quantidade inválida.');flow.qtd=q}else if(['dest'].includes(key)){let a=findAddress(v);if(!a)return fail('Destino inválido.');flow.dest=a}else if(['outend','invend','cend'].includes(key)){let a=findAddress(v);if(!a)return fail('Endereço inválido.');flow.end=a}else if(['outuz','invuz','cuz'].includes(key)){let u=uz(v);if(!u||u.status!=='ATIVA')return fail('UZ inválida.');flow.uz=u}else if(key==='lote')flow.lote=v;else if(key==='validade')flow.validade=v;else if(key==='forn')flow.forn=v;feedback(true,'Bipagem confirmada');flow.step++;draw()}async function execute(){try{let r;if(flow.op==='entrada')r=await db.rpc('wms_uz_receber',{p_uz:flow.uzCode,p_produto:flow.item.id,p_quantidade:flow.qtd,p_destino:flow.dest.id,p_lote:flow.lote||null,p_validade:flow.validade||null,p_fornecedor:flow.forn||null});else if(flow.op==='transferencia')r=await db.rpc('wms_uz_mover',{p_uz:flow.uz.codigo,p_destino:flow.dest.id});else if(flow.op==='saida')r=flow.uz?await db.rpc('wms_uz_baixar',{p_uz:flow.uz.codigo,p_produto:flow.item.id,p_quantidade:flow.qtd}):await db.rpc('wms_baixar_estoque_auto',{p_produto:flow.item.id,p_quantidade:flow.qtd,p_endereco:flow.end.id,p_motivo:'BAIXA'});else if(flow.op==='inventario')r=await db.rpc('wms_registrar_inventario_auto',{p_endereco:flow.end.id,p_produto:flow.item.id,p_quantidade_contada:flow.qtd,p_uz:flow.uz?.codigo||null,p_lote:null});else r=await db.rpc('wms_contagem_ciclica',{p_endereco:flow.end.id,p_uz_encontrada:flow.uz.codigo,p_produto:flow.item.id,p_quantidade_contada:flow.qtd,p_lote:null});if(r.error)throw r.error;feedback(true,'Registrado com sucesso');await load();home()}catch(e){fail(e.message)}}function startRepo(){rf={step:0,origem:null,uz:null,item:null,qtd:null,dest:null};hideAll();$('repo').classList.remove('hide');drawRepo()}function ri(label,ph){return'<label>'+label+'</label><input id="rv" autofocus placeholder="'+ph+'"><button class="btn" onclick="repoNext()">Continuar</button>'}function drawRepo(){let s=rf.step,h='';$('repoProgress').textContent=Math.min(s+1,5)+'/5';if(s===0)h=ri('Bipe o endereço de origem','ARMAZENAGEM');if(s===1)h='<div class="info">Origem: <b>'+rf.origem.codigo+'</b></div>'+ri('Bipe a UZ de origem','UZ ativa');if(s===2)h=summary(rf.uz)+ri('Bipe o produto','SKU / EAN');if(s===3)h='<div class="info">'+handling(rf.item)+'</div>'+ri('Quantidade para reposição','Quantidade');if(s===4)h='<div class="info"><b>Destino obrigatório: PICKING</b></div>'+ri('Bipe o endereço PICKING','PICKING');if(s===5)h='<div class="info"><b>Confirmar reposição</b><br>Origem: '+rf.origem.codigo+'<br>UZ: '+rf.uz.codigo+'<br>Produto: '+rf.item.nome+'<br>Quantidade: '+rf.qtd+'<br>Destino: '+rf.dest.codigo+'</div><button class="btn" onclick="execRepo()">Confirmar reposição</button><button class="btn secondary" onclick="home()">Cancelar</button>';$('repoStage').innerHTML=h;setTimeout(()=>{let v=$('rv');if(v){v.focus();v.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();repoNext()}}}},30)}function repoNext(){let v=String($('rv')?.value||'').trim();if(!v)return fail('Faça a bipagem.');if(rf.step===0){let a=findAddress(v);if(!a)return fail('Origem não encontrada.');if(String(a.tipo_endereco||'').toUpperCase()==='PICKING')return fail('PICKING não pode ser origem.');rf.origem=a}else if(rf.step===1){let u=uz(v);if(!u||u.status!=='ATIVA')return fail('UZ inexistente ou inativa.');if(u.endereco_id!==rf.origem.id)return fail('UZ não pertence à origem.');rf.uz=u}else if(rf.step===2){let p=findProduct(v);if(!p)return fail('Produto não encontrado.');if(!uzItems(rf.uz.id).some(x=>x.produto_id===p.id))return fail('Produto não pertence à UZ.');rf.item=p}else if(rf.step===3){let q=Number(v),er=qtyValid(rf.item,q);if(er)return fail(er);let saldo=uzItems(rf.uz.id).filter(x=>x.produto_id===rf.item.id).reduce((a,x)=>a+Number(x.quantidade||0),0);if(q>saldo)return fail('Quantidade maior que o saldo da UZ.');rf.qtd=q}else if(rf.step===4){let a=findAddress(v);if(!a)return fail('Destino não encontrado.');if(String(a.tipo_endereco||'').toUpperCase()!=='PICKING')return fail('Reposição permitida somente para PICKING.');rf.dest=a}feedback(true,'Bipagem confirmada');rf.step++;drawRepo()}async function execRepo(){try{let r=await db.rpc('wms_repor_picking',{p_uz:rf.uz.codigo,p_produto:rf.item.id,p_quantidade:rf.qtd,p_endereco_destino:rf.dest.id});if(r.error)throw r.error;feedback(true,'Reposição registrada no PICKING.');await load();setTimeout(startRepo,400)}catch(e){fail(e.message||'Erro na reposição')}}async function guard(){const{data:{session}}=await db.auth.getSession();if(!session){location.replace('login.html');return false}return true}async function load(){try{$('status').textContent='Carregando...';let rs=await Promise.all([db.from('produtos').select('*'),db.from('enderecos').select('*'),db.from('fornecedores').select('*'),db.from('uz_paletes').select('*'),db.from('uz_itens').select('*'),db.from('estoque').select('*')]),bad=rs.find(x=>x.error);if(bad)throw bad.error;[I,A,F,UZ,UI,ST]=rs.map(x=>x.data||[]);$('status').textContent='● Conectado'}catch(e){$('status').textContent='● Erro';fail(e.message)}}(async()=>{if(await guard())await load()})();</script></body></html>
