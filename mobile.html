<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WMS • Modo Celular</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script><style>:root{--y:#f5c400;--b:#111;--bg:#f5f6f7;--line:#e3e4e6;--muted:#74777c;--r:#c43b35;--g:#17875d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--b);font:15px Inter,Segoe UI,Arial,sans-serif}.top{position:sticky;top:0;z-index:5;background:#111;color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850}.brand span{display:inline-grid;place-items:center;background:var(--y);color:#111;width:32px;height:32px;border-radius:8px;margin-right:8px}.status{font-size:11px;color:#aaa}.wrap{padding:16px;max-width:640px;margin:auto}h1{font-size:22px;margin:5px 0}.sub{color:var(--muted);font-size:12px;margin:6px 0 20px}.ops{display:grid;grid-template-columns:1fr 1fr;gap:12px}.op,.card{background:#fff;border:1px solid var(--line);border-radius:14px}.op{padding:18px;text-align:left;min-height:120px;cursor:pointer}.op:before{content:'';display:block;width:32px;height:6px;background:var(--y);border-radius:8px;margin-bottom:18px}.op strong{display:block;font-size:16px;margin-bottom:7px}.op small{color:var(--muted)}.card{padding:18px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.tag{background:#fff7ce;border-radius:30px;padding:7px 10px;font-size:11px;font-weight:850}.back{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px;font-weight:700}.step{display:flex;gap:12px}.n{flex:0 0 34px;height:34px;border-radius:9px;background:#111;color:#fff;display:grid;place-items:center;font-weight:850}.body{width:100%}label{display:block;font-size:11px;font-weight:850;margin-bottom:8px}input,select{width:100%;padding:15px;border:1px solid #d8dadd;border-radius:10px;background:#fff;font-size:16px;outline:none}.btn{width:100%;margin-top:14px;border:0;border-radius:10px;background:var(--y);padding:14px;font-weight:850;font-size:15px}.info{margin-top:10px;padding:12px;background:#f4f4f4;border-radius:9px;font-size:12px;line-height:1.5}.err{color:var(--r)}.hide{display:none}.toast{position:fixed;left:14px;right:14px;bottom:18px;background:#111;color:#fff;padding:13px 15px;border-radius:10px;z-index:20}.orders{display:grid;gap:10px}.order{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.orderTop{display:flex;justify-content:space-between;gap:10px}.badge{font-size:10px;font-weight:800;background:#fff4bd;padding:6px 8px;border-radius:20px}.line{border-top:1px solid #eee;margin-top:12px;padding-top:12px}.line strong{display:block}.progress{font-size:11px;color:var(--muted);margin-top:4px}@media(max-width:380px){.ops{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand"><span>W</span>WMS Mobile</div><div id="status" class="status">Validando...</div></header><main class="wrap"><section id="home"><h1>Central de Bipagem</h1><div class="sub">Escolha a operação para iniciar.</div><div class="ops"><button class="op" onclick="startOp('entrada')"><strong>Recebimento</strong><small>Receber e armazenar material</small></button><button class="op" onclick="startOp('transferencia')"><strong>Mover posição</strong><small>Transferir material no estoque</small></button><button class="op" onclick="startOp('saida')"><strong>Baixa de estoque</strong><small>Retirar material da posição</small></button><button class="op" onclick="startOp('contagem')"><strong>Inventário</strong><small>Contagem física por posição</small></button><button class="op" onclick="openOrders()"><strong>Separar pedidos</strong><small>Bipar e separar itens dos pedidos</small></button></div></section><section id="work" class="hide"><div class="card"><div class="head"><span id="tag" class="tag"></span><button class="back" onclick="home()">Trocar operação</button></div><div id="stage"></div></div></section><section id="ordersPage" class="hide"><div class="head"><div><h1>Separar pedidos</h1><div class="sub">Selecione um pedido pendente.</div></div><button class="back" onclick="home()">Voltar</button></div><div id="orders" class="orders"></div></section><section id="pickPage" class="hide"><div class="head"><div><h1 id="pickTitle">Pedido</h1><div class="sub">Bipe o item para confirmar a separação.</div></div><button class="back" onclick="openOrders()">Pedidos</button></div><div id="pickLines" class="orders"></div></section></main><script>const $=x=>document.getElementById(x),db=window.supabase.createClient('https://wqhxzzvlxkhcogxqurlk.supabase.co','sb_publishable_8XtQPhzITuD5AuGHJ0DfQQ_iM5PAZ0w');let I=[],P=[],E=[],F=[],ORD=[],LINES=[],flow={},currentOrder=null;const plans={entrada:['item','qtd','lote','validade','forn','dest','confirm'],transferencia:['item','orig','qtd','dest','confirm'],saida:['item','orig','qtd','confirm'],contagem:['item','orig','qtd','confirm']};function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}function bal(pid,eid){return E.filter(x=>x.produto_id===pid&&x.endereco_id===eid).reduce((a,x)=>a+Number(x.quantidade||0),0)}function occ(id){return E.filter(x=>x.endereco_id===id).reduce((a,x)=>a+Number(x.quantidade||0),0)}function same(p,a){return String(p?.edificio||'').trim().toLowerCase()===String(a?.edificio||'').trim().toLowerCase()}function available(a,q=0){let c=Number(a.capacidade||0);return a.ativo!==false&&String(a.status||'DISPONIVEL').toUpperCase()==='DISPONIVEL'&&(!c||c-occ(a.id)>=q)}function hideAll(){['home','work','ordersPage','pickPage'].forEach(x=>$(x).classList.add('hide'))}function home(){hideAll();$('home').classList.remove('hide');flow={};currentOrder=null}function startOp(op){flow={op,step:0,item:null,orig:null,dest:null,qtd:1,lote:'',validade:'',forn:''};hideAll();$('work').classList.remove('hide');$('tag').textContent={entrada:'RECEBIMENTO',transferencia:'MOVER POSIÇÃO',saida:'BAIXA',contagem:'INVENTÁRIO'}[op];draw()}function next(){flow.step++;draw()}function draw(){let key=plans[flow.op][flow.step],n=flow.step+1,h='';if(key==='item')h='<label>Bipe o SKU / EAN</label><input id="v" autofocus placeholder="SKU ou código de barras">';if(key==='orig')h='<label>Bipe a posição de origem</label><input id="v" autofocus placeholder="Endereço físico">';if(key==='qtd')h='<label>'+(flow.op==='contagem'?'Quantidade contada':'Quantidade')+'</label><input id="v" autofocus type="number" min="0.001" step="any">';if(key==='lote')h='<label>Lote</label><input id="v" autofocus>';if(key==='validade')h='<label>Validade</label><input id="v" autofocus type="date">';if(key==='forn')h='<label>Fornecedor</label><select id="v"><option value="">Selecione</option>'+F.filter(x=>x.ativo!==false).map(x=>'<option>'+x.nome+'</option>').join('')+'</select>';if(key==='dest')h='<label>Bipe a posição de destino</label><input id="v" autofocus placeholder="Endereço físico">';if(key==='confirm')h='<label>Confirmar operação</label><div class="info"><b>'+flow.item.nome+'</b><br>Quantidade: '+flow.qtd+'</div><button class="btn" onclick="execute()">Confirmar e registrar</button>';$('stage').innerHTML='<div class="step"><div class="n">'+n+'</div><div class="body">'+h+(key==='confirm'?'':'<button class="btn" onclick="validate()">Continuar</button>')+'</div></div>';let v=$('v');if(v){v.focus();v.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();validate()}}}}function validate(){let key=plans[flow.op][flow.step],v=String($('v')?.value||'').trim();if(key==='item'){let p=I.find(x=>String(x.sku).toLowerCase()===v.toLowerCase()||String(x.ean||'').toLowerCase()===v.toLowerCase());if(!p)return toast('Item não encontrado.');flow.item=p}else if(key==='orig'){let a=P.find(x=>String(x.codigo||x.posicao).toLowerCase()===v.toLowerCase());if(!a||!same(flow.item,a))return toast('Posição inválida.');if(flow.op!=='contagem'&&bal(flow.item.id,a.id)<=0)return toast('Sem saldo nesta posição.');flow.orig=a}else if(key==='qtd'){let q=Number(v);if(!(q>0))return toast('Quantidade inválida.');if(flow.orig&&flow.op!=='contagem'&&q>bal(flow.item.id,flow.orig.id))return toast('Quantidade maior que o saldo.');flow.qtd=q}else if(key==='lote')flow.lote=v;else if(key==='validade')flow.validade=v;else if(key==='forn'){if(!v)return toast('Selecione o fornecedor.');flow.forn=v}else if(key==='dest'){let a=P.find(x=>String(x.codigo||x.posicao).toLowerCase()===v.toLowerCase());if(!a||!same(flow.item,a)||!available(a,flow.qtd))return toast('Destino inválido ou sem capacidade.');flow.dest=a}next()}async function execute(){try{let r;if(flow.op==='entrada')r=await db.rpc('wms_receber',{p_produto:flow.item.id,p_quantidade:flow.qtd,p_destino:flow.dest.id,p_lote:flow.lote||null,p_validade:flow.validade||null,p_documento:null,p_fornecedor:flow.forn||null,p_observacao:'Recebimento WMS Mobile'});else if(flow.op==='transferencia')r=await db.rpc('wms_movimentar',{p_produto:flow.item.id,p_tipo:'TRANSFERENCIA',p_quantidade:flow.qtd,p_origem:flow.orig.id,p_destino:flow.dest.id,p_lote:null,p_documento:null,p_observacao:'Transferência WMS Mobile'});else if(flow.op==='saida')r=await db.rpc('wms_movimentar',{p_produto:flow.item.id,p_tipo:'SAIDA',p_quantidade:flow.qtd,p_origem:flow.orig.id,p_destino:null,p_lote:null,p_documento:null,p_observacao:'Baixa WMS Mobile'});else{let dif=flow.qtd-bal(flow.item.id,flow.orig.id);if(!dif){toast('Contagem sem divergência.');return home()}r=await db.rpc('wms_movimentar',{p_produto:flow.item.id,p_tipo:dif>0?'AJUSTE_ENTRADA':'AJUSTE_SAIDA',p_quantidade:Math.abs(dif),p_origem:dif<0?flow.orig.id:null,p_destino:dif>0?flow.orig.id:null,p_lote:null,p_documento:null,p_observacao:'Inventário WMS Mobile'})}if(r.error)throw r.error;toast('Operação concluída.');await load();home()}catch(e){toast(e.message||'Erro na operação.')}}async function loadOrders(){let a=await db.from('pedidos').select('*').order('created_at',{ascending:false}),b=await db.from('pedido_itens').select('*');if(a.error)throw a.error;if(b.error)throw b.error;ORD=a.data||[];LINES=b.data||[]}async function openOrders(){try{await loadOrders();hideAll();$('ordersPage').classList.remove('hide');let pending=ORD.filter(o=>!['SEPARADO','CANCELADO'].includes(String(o.status||'').toUpperCase()));$('orders').innerHTML=pending.map(o=>{let ls=LINES.filter(l=>l.pedido_id===o.id),done=ls.reduce((s,l)=>s+Number(l.quantidade_separada||0),0),total=ls.reduce((s,l)=>s+Number(l.quantidade||0),0);return '<button class="order" onclick="openPick(\''+o.id+'\')"><div class="orderTop"><strong>Pedido '+String(o.numero||'')+'</strong><span class="badge">'+String(o.status||'PENDENTE')+'</span></div><div class="progress">'+done+' de '+total+' unidades separadas</div></button>'}).join('')||'<div class="card">Nenhum pedido pendente.</div>'}catch(e){toast(e.message||'Erro ao carregar pedidos.')}}function openPick(id){currentOrder=ORD.find(o=>o.id===id);hideAll();$('pickPage').classList.remove('hide');$('pickTitle').textContent='Pedido '+(currentOrder?.numero||'');renderPick()}function renderPick(){let ls=LINES.filter(l=>l.pedido_id===currentOrder.id);$('pickLines').innerHTML=ls.map(l=>{let p=I.find(x=>x.id===l.produto_id),left=Math.max(0,Number(l.quantidade||0)-Number(l.quantidade_separada||0));return '<div class="order line"><strong>'+String(p?.sku||'-')+' • '+String(p?.nome||'Item')+'</strong><div class="progress">Solicitado: '+Number(l.quantidade||0)+' • Separado: '+Number(l.quantidade_separada||0)+' • Falta: '+left+'</div>'+(left>0?'<input id="scan_'+l.id+'" placeholder="Bipe SKU / EAN" onkeydown="if(event.key===\'Enter\'){event.preventDefault();pickLine(\''+l.id+'\')}"/><button class="btn" onclick="pickLine(\''+l.id+'\')">Confirmar bipagem</button>':'<div class="info">Item concluído ✓</div>')+'</div>'}).join('')||'<div class="card">Pedido sem itens.</div>'}async function pickLine(id){try{let l=LINES.find(x=>x.id===id),p=I.find(x=>x.id===l.produto_id),v=String($('scan_'+id)?.value||'').trim();if(!v)return toast('Bipe o item.');if(v.toLowerCase()!==String(p?.sku||'').toLowerCase()&&v.toLowerCase()!==String(p?.ean||'').toLowerCase())return toast('Item não corresponde ao pedido.');let sep=Number(l.quantidade_separada||0);if(sep>=Number(l.quantidade||0))return toast('Item já concluído.');let u=await db.from('pedido_itens').update({quantidade_separada:sep+1}).eq('id',id);if(u.error)throw u.error;l.quantidade_separada=sep+1;let orderLines=LINES.filter(x=>x.pedido_id===currentOrder.id),done=orderLines.every(x=>Number(x.quantidade_separada||0)>=Number(x.quantidade||0));let st=done?'SEPARADO':'EM_SEPARACAO';let po=await db.from('pedidos').update({status:st}).eq('id',currentOrder.id);if(po.error)throw po.error;currentOrder.status=st;toast(done?'Pedido separado com sucesso.':'Item separado.');if(done)return openOrders();renderPick()}catch(e){toast(e.message||'Erro ao separar item.')}}async function guard(){const {data:{session},error}=await db.auth.getSession();if(error)throw error;if(!session){location.replace('login.html');return false}const {data:p,error:pe}=await db.from('perfis').select('perfil').eq('user_id',session.user.id).maybeSingle();if(pe)throw pe;if(!p){await db.auth.signOut();location.replace('login.html');return false}return true}async function load(){try{$('status').textContent='Carregando...';let rs=await Promise.all([db.from('produtos').select('*').order('nome'),db.from('enderecos').select('*').order('codigo'),db.from('estoque').select('*'),db.from('fornecedores').select('*').order('nome')]);let bad=rs.find(x=>x.error);if(bad)throw bad.error;[I,P,E,F]=rs.map(x=>x.data||[]);$('status').textContent='● Conectado'}catch(e){$('status').textContent='● Erro';toast(e.message)}}(async()=>{try{if(await guard())await load()}catch(e){$('status').textContent='● Erro';toast(e.message)}})();</script></body></html>
