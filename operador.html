<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WMS • Operador</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#15171a;font:13px Inter,Segoe UI,Arial,sans-serif}.top{height:58px;background:#111315;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{font-weight:800}.brand b{display:inline-grid;place-items:center;width:30px;height:30px;background:#ffc800;color:#111;border-radius:8px;margin-right:9px}.logout{border:1px solid #333;background:#1b1d20;color:#ddd;border-radius:8px;padding:8px 10px}.wrap{max-width:900px;margin:auto;padding:34px 20px}h1{font-size:23px;margin:0}.sub{color:#7d8593;font-size:11px;margin:6px 0 25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{border:1px solid #e5e8ec;background:#fff;border-radius:15px;padding:22px;text-align:left;min-height:145px;cursor:pointer}.card:before{content:'';display:block;width:28px;height:4px;background:#ffc800;border-radius:5px;margin-bottom:22px}.card strong{font-size:16px;display:block;margin-bottom:7px}.card small{color:#7d8593}.panel{background:#fff;border:1px solid #e5e8ec;border-radius:15px;padding:18px;margin-top:18px}.order{border-bottom:1px solid #eee;padding:14px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.btn{border:1px solid #e4b700;background:#ffc800;border-radius:9px;padding:9px 12px;font-weight:800}.hide{display:none}.muted{font-size:11px;color:#7d8593}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:24px 14px}}</style></head><body><header class="top"><div class="brand"><b>W</b>WMS • Operador</div><button class="logout" onclick="logout()">Sair</button></header><main class="wrap"><h1>Operação</h1><div class="sub">Acesso limitado à bipagem e separação de pedidos.</div><div class="grid"><button class="card" onclick="location.href='mobile.html'"><strong>Central de Bipagem</strong><small>Recebimento, movimentação, baixa e contagem.</small></button><button class="card" onclick="showOrders()"><strong>Separar pedidos</strong><small>Visualizar e concluir pedidos pendentes.</small></button></div><section id="orders" class="panel hide"><h2>Pedidos pendentes</h2><div id="list"></div></section></main><script>const db=supabase.createClient('https://wqhxzzvlxkhcogxqurlk.supabase.co','sb_publishable_8XtQPhzITuD5AuGHJ0DfQQ_iM5PAZ0w');let O=[],OI=[],I=[],E=[];async function guard(){let {data:{session}}=await db.auth.getSession();if(!session)return location.href='login.html';let {data:p}=await db.from('perfis').select('perfil').eq('user_id',session.user.id).single();if(!p)return location.href='login.html';if(p.perfil==='ADMINISTRADOR')return location.href='index.html';await load()}async function load(){let rs=await Promise.all([db.from('pedidos').select('*').order('created_at',{ascending:false}),db.from('pedido_itens').select('*'),db.from('produtos').select('*'),db.from('estoque').select('*')]);if(rs.some(x=>x.error))return;[O,OI,I,E]=rs.map(x=>x.data||[])}function item(id){return I.find(x=>x.id===id)}function stock(id){return E.filter(x=>x.produto_id===id).reduce((a,x)=>a+Number(x.quantidade||0),0)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function showOrders(){await load();document.getElementById('orders').classList.remove('hide');let pend=O.filter(x=>x.status!=='SEPARADO');document.getElementById('list').innerHTML=pend.length?pend.map(o=>'<div class="order"><div><strong>Pedido '+esc(o.numero)+'</strong><div class="muted">'+OI.filter(x=>x.pedido_id===o.id).length+' item(ns)</div></div><button class="btn" onclick="openOrder(\''+o.id+'\')">Separar</button></div>').join(''):'<p class="muted">Nenhum pedido pendente.</p>'}function openOrder(id){let o=O.find(x=>x.id===id),its=OI.filter(x=>x.pedido_id===id);document.getElementById('list').innerHTML='<button class="logout" style="color:#333;background:#fff" onclick="showOrders()">← Voltar</button><h3>Pedido '+esc(o.numero)+'</h3>'+its.map(x=>{let p=item(x.produto_id),q=Number(x.quantidade),s=Number(x.quantidade_separada||0);return '<div class="order"><div><strong>'+esc(p?.sku||'-')+' — '+esc(p?.nome||'-')+'</strong><div class="muted">Solicitado: '+q+' • Saldo: '+stock(x.produto_id)+' • Separado: '+s+'</div></div><button class="btn" onclick="picked(\''+x.id+'\',\''+id+'\')">Marcar separado</button></div>'}).join('')}async function picked(line,oid){let x=OI.find(a=>a.id===line),q=Number(x.quantidade);if(stock(x.produto_id)<q)return alert('Saldo insuficiente.');let r=await db.from('pedido_itens').update({quantidade_separada:q}).eq('id',line);if(r.error)return alert(r.error.message);x.quantidade_separada=q;if(OI.filter(a=>a.pedido_id===oid).every(a=>Number(a.quantidade_separada)>=Number(a.quantidade))){let u=await db.from('pedidos').update({status:'SEPARADO',updated_at:new Date().toISOString()}).eq('id',oid);if(u.error)return alert(u.error.message)}await load();showOrders()}async function logout(){await db.auth.signOut();location.href='login.html'}guard();</script></body></html>
