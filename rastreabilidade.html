<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WMS • Rastreabilidade</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script><style>:root{--y:#f4c900;--ink:#171717;--bg:#f7f7f5;--line:#e8e8e5;--muted:#777}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px Inter,Segoe UI,Arial,sans-serif}.top{height:62px;background:#171717;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0}.brand{font-weight:800}.brand b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--y);color:#111;margin-right:10px}.back{border:1px solid #444;background:#222;color:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}.wrap{max-width:1400px;margin:auto;padding:30px 24px}h1{font-size:26px;margin:0 0 5px}.sub{color:var(--muted);margin-bottom:22px}.filters{display:grid;grid-template-columns:2fr 1.4fr 1fr;gap:10px}.filters input,.filters select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;background:#fff}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:11px}.card{padding:18px}.label{font-size:9px;text-transform:uppercase;color:#888;font-weight:700}.num{font-size:25px;font-weight:800;margin-top:8px}.panel{margin-top:15px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{padding:12px 14px;border-bottom:1px solid #eee;text-align:left;font-size:11px}th{font-size:8px;text-transform:uppercase;color:#888;background:#fafafa}.badge{display:inline-block;padding:5px 7px;border-radius:6px;background:#f1f1ef;font-size:9px;font-weight:700}.uz{background:#1c1c1c;color:#fff}.empty{text-align:center;color:#999;padding:35px!important}@media(max-width:700px){.filters,.cards{grid-template-columns:1fr}.wrap{padding:20px 13px}}</style></head><body><header class="top"><div class="brand"><b>W</b>Rastreabilidade WMS</div><button class="back" onclick="location.href='index.html'">Voltar ao WMS</button></header><main class="wrap"><h1>Rastreabilidade</h1><div class="sub">Consulte a vida da UZ e as operações realizadas por cada usuário.</div><div class="filters"><input id="q" placeholder="Pesquisar UZ, SKU, item, endereço, tipo..." oninput="render()"><select id="user" onchange="render()"><option value="">Todos os operadores</option></select><select id="period" onchange="render()"><option value="0">Todo período</option><option value="1">Hoje</option><option value="7">7 dias</option><option value="30">30 dias</option></select></div><div class="cards"><div class="card"><div class="label">Movimentações</div><div id="kMov" class="num">0</div></div><div class="card"><div class="label">UZ movimentadas</div><div id="kUz" class="num">0</div></div><div class="card"><div class="label">Operadores</div><div id="kOp" class="num">0</div></div><div class="card"><div class="label">Quantidade movimentada</div><div id="kQtd" class="num">0</div></div></div><div class="panel"><table><thead><tr><th>Data/Hora</th><th>Operador</th><th>Tipo</th><th>UZ</th><th>SKU</th><th>Item</th><th>Origem</th><th>Destino</th><th>Lote</th><th>Qtd.</th><th>Motivo</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const db=window.supabase.createClient('https://wqhxzzvlxkhcogxqurlk.supabase.co','sb_publishable_8XtQPhzITuD5AuGHJ0DfQQ_iM5PAZ0w'),$=x=>document.getElementById(x);let M=[],I=[],A=[],UZ=[],P=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const item=id=>I.find(x=>x.id===id),addr=id=>A.find(x=>x.id===id),uz=id=>UZ.find(x=>x.id===id),profile=id=>P.find(x=>x.user_id===id);async function guard(){let s=await db.auth.getSession();if(!s.data.session)return location.replace('login.html');let r=await db.from('perfis').select('perfil').eq('user_id',s.data.session.user.id).maybeSingle();if(r.data?.perfil!=='ADMINISTRADOR')location.replace('operador.html')}async function load(){await guard();let rs=await Promise.all([db.from('movimentacoes').select('*').order('created_at',{ascending:false}).limit(2000),db.from('produtos').select('id,sku,nome'),db.from('enderecos').select('id,codigo,posicao'),db.from('uz_paletes').select('id,codigo'),db.from('perfis').select('user_id,nome,perfil')]);let bad=rs.find(x=>x.error);if(bad)return alert(bad.error.message);[M,I,A,UZ,P]=rs.map(x=>x.data||[]);$('user').innerHTML='<option value="">Todos os operadores</option>'+P.map(p=>'<option value="'+p.user_id+'">'+esc(p.nome||p.user_id)+'</option>').join('');render()}function render(){let q=$('q').value.toLowerCase().trim(),uid=$('user').value,days=Number($('period').value),cut=days?Date.now()-days*86400000:0;let r=M.filter(m=>{let p=item(m.produto_id),u=uz(m.uz_id),o=addr(m.endereco_origem_id),d=addr(m.endereco_destino_id),who=profile(m.usuario_id);let hay=[m.tipo,u?.codigo,p?.sku,p?.nome,o?.codigo,d?.codigo,m.lote,m.motivo,who?.nome].join(' ').toLowerCase();return(!uid||m.usuario_id===uid)&&(!cut||new Date(m.created_at).getTime()>=cut)&&(!q||hay.includes(q))});$('kMov').textContent=r.length;$('kUz').textContent=new Set(r.map(x=>x.uz_id).filter(Boolean)).size;$('kOp').textContent=new Set(r.map(x=>x.usuario_id).filter(Boolean)).size;$('kQtd').textContent=r.reduce((s,x)=>s+Number(x.quantidade||0),0).toLocaleString('pt-BR');$('rows').innerHTML=r.map(m=>{let p=item(m.produto_id),u=uz(m.uz_id),o=addr(m.endereco_origem_id),d=addr(m.endereco_destino_id),who=profile(m.usuario_id);return'<tr><td>'+new Date(m.created_at).toLocaleString('pt-BR')+'</td><td><b>'+esc(who?.nome||m.operador||m.usuario_id||'-')+'</b></td><td><span class="badge">'+esc(m.tipo||'-')+'</span></td><td><span class="badge uz">'+esc(u?.codigo||'Sem UZ')+'</span></td><td>'+esc(p?.sku||'-')+'</td><td>'+esc(p?.nome||'-')+'</td><td>'+esc(o?.codigo||o?.posicao||'-')+'</td><td>'+esc(d?.codigo||d?.posicao||'-')+'</td><td>'+esc(m.lote||'-')+'</td><td><b>'+Number(m.quantidade||0).toLocaleString('pt-BR')+'</b></td><td>'+esc(m.motivo||m.observacao||'-')+'</td></tr>'}).join('')||'<tr><td colspan="11" class="empty">Nenhuma movimentação encontrada.</td></tr>'}load();</script></body></html>
